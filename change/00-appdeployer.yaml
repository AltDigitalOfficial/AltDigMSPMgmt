AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform — the AppDeployer role (prompt 8.1). The single
  control point through which a tenant's CI deploys into a member account. OIDC
  federation only, no static credentials, and a permissions boundary the role
  cannot remove from itself.

# ---------------------------------------------------------------------------
# Why a role at all, when AltDigital does not control the pipeline
# ---------------------------------------------------------------------------
# design/08-change-and-release.md, "The constraint":
#
#   Development teams are not overseen by AltDigital. SOC 2 requires visibility
#   and approval of changes to the environment. We therefore cannot rely on a
#   gate we control — change management is a detective control, reconciled
#   continuously.
#
# So this role is not a gate that approves anything. It is the CHOKE POINT that
# makes the detective control possible: every deployment passes through one
# named principal, so every deployment is attributable in CloudTrail whether the
# dev team cooperates or not.
#
# design 08 again, on why that survives a change of supplier: "A later team
# arriving with its own pipeline keeps their pipeline — they simply hand off at
# this role. The control point stays constant even as the tooling varies."
#
# ---------------------------------------------------------------------------
# No static credentials. Ever.
# ---------------------------------------------------------------------------
# The trust policy below federates an OIDC provider and nothing else. There is
# no IAM user, no access key, and no cross-account role that could be given one.
#
# That is worth more than it sounds. A long-lived deploy key in a CI system is
# the credential most likely to end up in a repository, a support ticket or a
# container image, and it is the one nobody rotates because rotating it breaks
# the pipeline on a Friday. An OIDC token is minted per run, expires in minutes,
# and cannot be copied anywhere useful.
#
# THE SUBJECT CONDITION IS THE WHOLE CONTROL. Trusting the provider alone would
# let ANY repository on that CI platform — anyone's GitHub account, anywhere —
# assume this role. `token.actions.githubusercontent.com` is a single issuer
# shared by every GitHub user on earth. The `sub` condition is what narrows it
# to one tenant's repository, and this template refuses to deploy without one.

# ---------------------------------------------------------------------------
# What the pipeline may build, and what it may never do (2026-10-02)
# ---------------------------------------------------------------------------
# Until 2026-10-02 this role deployed compute only, and every data store,
# queue and topic was a request to AltDigital. That was an early assumption,
# not a compliance decision. Jamie's line, 2026-10-02: the pipeline provisions
# pretty much anything, EXCEPT what would compromise HIPAA or SOC 2, or
# AltDigital's ability to keep the application up.
#
#   granted       S3, RDS/Aurora, DynamoDB, ElastiCache, EFS, SQS, SNS,
#                 EventBridge, CloudWatch alarms and dashboards, application
#                 security groups, secrets and parameters -- all named for the
#                 application, all in the approved regions
#   compliance    unencrypted RDS, EFS or ElastiCache refused at creation;
#                 SNS subscriptions that deliver outside AWS (email, SMS,
#                 HTTP) refused; the account's S3 public access block is
#                 untouchable
#   stability     in uat and prod, data stores cannot be deleted at all
#   not granted   IAM, beyond passing the application's own roles and the
#                 service-linked roles AWS defines. Application roles are an
#                 AltDigital request: "I'm not scared of a ticket queue if it
#                 prevents us from having compliance issues or outages."
#
# Some compliance properties have no IAM condition key and are DETECTED by
# Security Hub's default standards instead of refused here: RDS
# PubliclyAccessible, PITR or backup retention switched off, a security group
# open to the internet. That split is stated in docs/developer-guide.md rather
# than implied away. Log retention has no check in the default standards at
# all, and is not claimed as covered.

Parameters:

  AccountTier:
    Type: String
    Default: prod
    AllowedValues: [test, uat, prod]
    Description: >-
      The tier of the account this role deploys into. In uat and prod, data
      stores cannot be deleted by the pipeline. Defaults to prod so that a
      forgotten parameter gets the stricter behaviour, never the looser one.
      There is no dev value: dev changes directly and has no deploy role.

  ApplicationCode:
    Type: String
    AllowedPattern: '^[a-z0-9]([a-z0-9-]{0,8}[a-z0-9])?$'
    Description: >-
      The application this role deploys, from the account naming convention.
      Used to scope every resource pattern below, so two applications in one
      account cannot deploy over each other.

  AllowedRegions:
    Type: CommaDelimitedList
    Description: >-
      Regions the application may deploy compute into. Pass
      PLATFORM_ALLOWED_REGIONS from config/platform.env. No default, because a
      default would be a second copy of the list that nothing keeps in step
      with SCP 06. Scopes TheApplicationsOwnCompute, which until B-136 had no
      region limit of its own and relied on an SCP exemption it should never
      have had.

  OidcProviderUrl:
    Type: String
    Default: 'https://token.actions.githubusercontent.com'
    AllowedPattern: '^https://.+'
    Description: >-
      The tenant's CI identity provider. Questionnaire 8.1 collects the tooling
      (`cicd_tooling`); this is the issuer that tooling actually presents.

      GitHub Actions is the default because it is the common case, not because
      it is assumed — GitLab, Bitbucket Pipelines and CircleCI all publish an
      OIDC issuer and all work here unchanged.

  OidcAudience:
    Type: String
    Default: 'sts.amazonaws.com'
    Description: >-
      The `aud` claim. For GitHub Actions configured with
      aws-actions/configure-aws-credentials this is sts.amazonaws.com.

  OidcSubjectPattern:
    Type: String
    MinLength: 3
    Description: >-
      REQUIRED, and the most important parameter in this template.

      The `sub` claim pattern that may assume the role, e.g.
      `repo:acme-corp/payments-service:ref:refs/heads/main` or
      `repo:acme-corp/payments-service:environment:production`.

      There is no default and no wildcard-only value accepted, because the OIDC
      issuer is shared by every user of that CI platform. A trust policy that
      checks the issuer and not the subject is assumable by any repository in
      the world — it looks like federation and is an open door.

      Prefer pinning to a branch or a deployment environment rather than
      `repo:org/name:*`. A pattern ending in `:*` lets any branch, including one
      opened by a pull request from a fork, deploy to production.

  OidcThumbprintList:
    Type: CommaDelimitedList
    Default: '6938fd4d98bab03faadb97b34396831e3780aea1'
    Description: >-
      Certificate thumbprint(s) for the provider. The default is GitHub's
      long-standing value.

      AWS no longer verifies this for well-known providers and rotates it
      itself, so a stale value is usually harmless — "usually" being why it is a
      parameter rather than a constant.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      An IAM OIDC provider is an ACCOUNT-LEVEL resource, one per issuer URL.
      Two stacks in the same account both trying to create
      token.actions.githubusercontent.com will collide — the second fails with
      EntityAlreadyExists, which names the entity and not the other stack.

      Set false for the second and subsequent applications in an account and
      pass ExistingOidcProviderArn instead.

  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: 'Used when CreateOidcProvider is false.'

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']
  # uat holds real data (design 14) and is protected as prod is.
  ProtectData: !Not [!Equals [!Ref AccountTier, test]]

Resources:

  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    # Retain. The provider is shared by every AppDeployer role in the account,
    # so deleting this stack must not break the other applications' pipelines.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: !Ref OidcProviderUrl
      ClientIdList: [!Ref OidcAudience]
      ThumbprintList: !Ref OidcThumbprintList

  # -------------------------------------------------------------------------
  # The boundary, defined before the role that must carry it
  # -------------------------------------------------------------------------
  # Prompt 8.1: "Include a permissions boundary so the role cannot escalate
  # itself."
  #
  # A boundary is a ceiling, not a grant. Whatever the role's own policy says,
  # the effective permission is the intersection — so a tenant who talks
  # somebody into widening the role's policy still cannot exceed this.
  #
  # The explicit denies matter more than the allows. Without them, a role with
  # iam:* in its own policy could create a SECOND role with no boundary and
  # assume it, which is the classic boundary escape and the reason
  # iam:CreateRole is denied here unless the new role carries this same
  # boundary.
  AppDeployerBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'PlatformAppDeployerBoundary-${ApplicationCode}'
      Description: >-
        Permissions boundary for the AppDeployer role. Caps what the role can
        ever do, regardless of what its own policy grants.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TheCeiling
            Effect: Allow
            # Deliberately broad on the allow side. The boundary's job is to
            # cap, and the role's OWN policy is what grants; listing services
            # here as well would mean maintaining the same list twice and
            # discovering the drift when a legitimate deploy fails.
            Action:
              - 'cloudformation:*'
              - 'ecs:*'
              - 'lambda:*'
              - 'ec2:Describe*'
              - 'ec2:CreateSecurityGroup'
              - 'ec2:DeleteSecurityGroup'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:ModifySecurityGroupRules'
              - 'ec2:UpdateSecurityGroupRuleDescriptions*'
              - 'ec2:CreateTags'
              - 'ecr:*'
              - 'logs:*'
              - 's3:*'
              - 'rds:*'
              - 'dynamodb:*'
              - 'elasticache:*'
              - 'elasticfilesystem:*'
              - 'elasticloadbalancing:*'
              - 'application-autoscaling:*'
              - 'apigateway:*'
              - 'states:*'
              - 'events:*'
              - 'sqs:*'
              - 'sns:*'
              - 'cloudwatch:*'
              - 'ssm:GetParameter*'
              - 'ssm:PutParameter'
              - 'ssm:DeleteParameter*'
              - 'ssm:DescribeParameters'
              - 'ssm:AddTagsToResource'
              - 'ssm:ListTagsForResource'
              - 'secretsmanager:*'
              - 'iam:PassRole'
              - 'iam:CreateServiceLinkedRole'
              - 'iam:Get*'
              - 'iam:List*'
              - 'sts:GetCallerIdentity'
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
              - 'kms:CreateGrant'
            Resource: '*'

          # -----------------------------------------------------------------
          # Compliance: refused at creation, wherever a condition key exists
          # -----------------------------------------------------------------
          # In the boundary rather than the role's policy so that a widened
          # role policy cannot undo them. BoolIfExists, so a request that
          # omits the encryption flag -- CloudFormation's default for
          # AWS::RDS::DBInstance is unencrypted -- is refused, not waved
          # through.
          #
          # Aurora member instances are excluded from the RDS instance rule:
          # their storage is the cluster's, which the cluster rule covers,
          # and the flag may be absent on the instance request.
          #
          # PROVEN 2026-10-02 in Sandbox Canary by
          # scripts/test-deployer-conditions.sh (B-153). For RDS instances,
          # Aurora clusters, EFS and ElastiCache: flag omitted is refused,
          # flag false is refused, flag true is authorized. An Aurora member
          # instance with no flag is authorized. Re-run that script after any
          # change to these statements.
          - Sid: NoUnencryptedRdsCluster
            Effect: Deny
            Action: 'rds:CreateDBCluster'
            Resource: '*'
            Condition:
              BoolIfExists:
                'rds:StorageEncrypted': 'false'

          - Sid: NoUnencryptedRdsInstance
            Effect: Deny
            Action: 'rds:CreateDBInstance'
            Resource: '*'
            Condition:
              BoolIfExists:
                'rds:StorageEncrypted': 'false'
              StringNotLikeIfExists:
                'rds:DatabaseEngine': 'aurora*'

          - Sid: NoUnencryptedFileSystems
            Effect: Deny
            Action: 'elasticfilesystem:CreateFileSystem'
            Resource: '*'
            Condition:
              BoolIfExists:
                'elasticfilesystem:Encrypted': 'false'

          # Resource-scoped, unlike the others, and not by choice.
          # CreateReplicationGroup is authorized against several resources
          # -- the replication group, and its parameter, subnet and user
          # groups -- and the encryption key is only present on the
          # replication group. Against Resource '*', BoolIfExists met the
          # parameter group's evaluation with no key, and refused an
          # encrypted request (observed 2026-10-02, B-153).
          - Sid: NoUnencryptedCaches
            Effect: Deny
            Action: 'elasticache:CreateReplicationGroup'
            Resource: !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:replicationgroup:*'
            Condition:
              BoolIfExists:
                'elasticache:AtRestEncryptionEnabled': 'false'

          # A subscription is how regulated data leaves the account without
          # anything that looks like an export: an alarm or an event payload
          # forwarded to a mailbox or a webhook. Delivery stays inside AWS
          # (SQS, Lambda, Firehose); anything else is a reviewed change.
          - Sid: NoSubscriptionsOutsideAws
            Effect: Deny
            Action: 'sns:Subscribe'
            Resource: '*'
            Condition:
              StringEquals:
                'sns:Protocol': [email, email-json, sms, http, https]

          # The account-level block is what makes every bucket-level setting
          # irrelevant, so it is the one that must never move. Bucket-level
          # PutBucketPublicAccessBlock stays allowed: CloudFormation calls it
          # whenever a template sets PublicAccessBlockConfiguration, including
          # to all-true, and denying it would refuse the careful template.
          - Sid: NeverTheAccountPublicAccessBlock
            Effect: Deny
            Action: 's3:PutAccountPublicAccessBlock'
            Resource: '*'

          # -----------------------------------------------------------------
          # Stability: in uat and prod, data stores are never deleted
          # -----------------------------------------------------------------
          # The failure this exists for is not a malicious delete. It is a
          # one-line template change that makes CloudFormation REPLACE a
          # database -- create a new one, then delete the old -- with every
          # permission check passing. With this deny the delete fails; the
          # data survives, and the stack reports the cleanup failure.
          #
          # It does not stop the stack pointing at the NEW, empty resource.
          # Only an explicit resource name does that (CloudFormation refuses
          # to replace a custom-named resource), which is why the developer
          # guide tells people to name their data stores. A deliberate
          # deletion in uat or prod is an AltDigital change.
          - !If
            - ProtectData
            - Sid: NeverDeleteDataInProduction
              Effect: Deny
              Action:
                - 'rds:DeleteDBInstance'
                - 'rds:DeleteDBCluster'
                - 'rds:DeleteDBSnapshot'
                - 'rds:DeleteDBClusterSnapshot'
                - 'dynamodb:DeleteTable'
                - 'dynamodb:DeleteBackup'
                - 's3:DeleteBucket'
                - 'elasticache:DeleteReplicationGroup'
                - 'elasticache:DeleteCacheCluster'
                - 'elasticache:DeleteServerlessCache'
                - 'elasticfilesystem:DeleteFileSystem'
                - 'sqs:DeleteQueue'
                - 'secretsmanager:DeleteSecret'
              Resource: '*'
            - !Ref AWS::NoValue

          - Sid: NeverTouchPlatformManagedResources
            Effect: Deny
            # design 08: "Denied from touching platform-managed resources
            # (SCP)". The SCP is the outer fence; this is the inner one, and
            # both exist because they fail differently. An SCP protects against
            # everything in the account; a boundary travels with the role even
            # if the account is later moved out from under that SCP.
            Action: '*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Platform*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/Platform*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/OrganizationAccountAccessRole'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stacksets-exec-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/platform/*'

          - Sid: NeverEscapeTheBoundary
            Effect: Deny
            # The escape this exists to close: create a new role WITHOUT a
            # boundary, give it everything, assume it. Creating roles is
            # permitted only when the new role carries this exact boundary,
            # so the ceiling is inherited rather than shed.
            Action:
              - 'iam:CreateRole'
              - 'iam:CreateUser'
            Resource: '*'
            Condition:
              StringNotEquals:
                'iam:PermissionsBoundary': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/PlatformAppDeployerBoundary-${ApplicationCode}'

          - Sid: NeverAlterTheBoundaryItself
            Effect: Deny
            # Without this, the role could rewrite its own ceiling. Note
            # DeleteRolePermissionsBoundary in particular — removing the
            # boundary is the same escape as never having had one.
            Action:
              - 'iam:DeleteRolePermissionsBoundary'
              - 'iam:DeleteUserPermissionsBoundary'
              - 'iam:PutRolePermissionsBoundary'
              - 'iam:PutUserPermissionsBoundary'
              - 'iam:CreatePolicyVersion'
              - 'iam:DeletePolicy'
              - 'iam:DeletePolicyVersion'
              - 'iam:SetDefaultPolicyVersion'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/PlatformAppDeployerBoundary-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/TenantAppDeployer-*'

          - Sid: NeverDisarmTheDetectiveControl
            Effect: Deny
            # The whole of design 08 rests on CloudTrail being the
            # authoritative record. A deployer that can stop logging can
            # deploy unobserved, and reconciliation would show a quiet month
            # rather than a gap.
            #
            # These are also denied by SCP. Both, because a boundary is
            # attached to the role and an SCP to the account, and the question
            # "which one is missing" should never have a single answer.
            Action:
              - 'cloudtrail:StopLogging'
              - 'cloudtrail:DeleteTrail'
              - 'cloudtrail:UpdateTrail'
              - 'cloudtrail:PutEventSelectors'
              - 'config:DeleteConfigurationRecorder'
              - 'config:StopConfigurationRecorder'
              - 'config:DeleteDeliveryChannel'
              - 'guardduty:DeleteDetector'
              - 'guardduty:UpdateDetector'
              - 'securityhub:DisableSecurityHub'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey'
              - 'backup:DeleteBackupVault'
              - 'backup:DeleteRecoveryPoint'
              - 'organizations:LeaveOrganization'
            Resource: '*'

  # -------------------------------------------------------------------------
  # The role
  # -------------------------------------------------------------------------
  AppDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      # NOT Platform-prefixed, deliberately (B-136, D-026). It was, so that
      # SCP 03's protection of platform roles would stop a tenant rewriting its
      # own deployer's trust policy and pointing it at any repository. But the
      # same prefix put it inside every SCP's platform exemption, so a pipeline
      # AltDigital does not control was exempt from region restriction,
      # required tags and the bypass controls.
      #
      # SCP 03 now protects TenantAppDeployer-* by name. The protection stays
      # and the exemption goes. Changing RoleName replaces the role and changes
      # its ARN, and the tenant pipeline's configured role ARN must change at
      # the same time.
      RoleName: !Sub 'TenantAppDeployer-${ApplicationCode}'
      Description: >-
        The single control point for tenant deployments into this account.
        Assumable only by the tenant CI identity over OIDC. Every assumption is
        reconciled against a change record - design 08.
      # One hour. A deploy that needs longer than an hour of continuously valid
      # credentials is a deploy that should be broken into steps; the cost of a
      # leaked short-lived token scales with this number.
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref AppDeployerBoundary
      # Written as a !Sub'd JSON STRING rather than as YAML, and not by choice.
      #
      # An IAM condition KEY here has to be `<issuer-host>:aud`, which means
      # interpolating a parameter into a mapping key. CloudFormation refuses:
      # `Unhashable type "{'Fn::Sub': ...}"`, an error that names the YAML
      # construct and says nothing about condition keys. The same trap caught
      # containment/20-exercise-target.yaml, where the fix was to hardcode the
      # key — viable there because it was one tag, not viable here because the
      # issuer varies per tenant and hardcoding GitHub would silently break
      # every GitLab tenant.
      #
      # AssumeRolePolicyDocument accepts a JSON string, so !Sub can build the
      # whole document and the keys interpolate normally.
      #
      # Note the host is the URL with the scheme STRIPPED. The condition key is
      # `token.actions.githubusercontent.com:sub`, not
      # `https://token.actions.githubusercontent.com:sub` — a trust policy with
      # the scheme left on parses, deploys, and then matches nothing, so every
      # assumption fails with a message about the token rather than about the
      # policy.
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${ProviderArn}" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": { "${IssuerHost}:aud": "${OidcAudience}" },
                  "StringLike": { "${IssuerHost}:sub": "${OidcSubjectPattern}" }
                }
              }
            ]
          }
        - ProviderArn: !If
            - MakeProvider
            - !Ref OidcProvider
            - !Ref ExistingOidcProviderArn
          IssuerHost: !Select [1, !Split ['https://', !Ref OidcProviderUrl]]
      Tags:
        - { Key: platform-managed, Value: 'true' }
        # The platform builds it, even though the tenant's pipeline uses it.
        # CLAUDE.md hard rule, B-127.
        - { Key: platform-layer, Value: infrastructure }
        - { Key: platform-purpose, Value: tenant-deployment }
        - { Key: platform-application, Value: !Ref ApplicationCode }

  AppDeployerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: Deploy
      Roles: [!Ref AppDeployerRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DeployTheApplicationStack
            Effect: Allow
            # Scoped by NAME to this application. design 08: "Scoped to the
            # resources that application legitimately deploys". Two tenants'
            # applications in one account cannot reach each other's stacks.
            Action: 'cloudformation:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationCode}-*/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/*'
          - Sid: ReadCloudFormationGlobally
            Effect: Allow
            # ValidateTemplate and the List* calls have no resource to scope
            # to; CloudFormation rejects a resource ARN on them entirely.
            Action:
              - 'cloudformation:ValidateTemplate'
              - 'cloudformation:List*'
              - 'cloudformation:Describe*'
            Resource: '*'
          - Sid: TheApplicationsOwnCompute
            Effect: Allow
            Action:
              - 'ecs:*'
              - 'lambda:*'
              - 'states:*'
              - 'apigateway:*'
              - 'elasticloadbalancing:*'
              - 'application-autoscaling:*'
            Resource: '*'
            # The role's own region limit, alongside SCP 06 and not instead of
            # it. Same reasoning as the boundary: a policy on the role travels
            # with the role, and an SCP stays with the OU.
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedRegions
          - Sid: ImagesAndArtifacts
            Effect: Allow
            Action: ['ecr:*']
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ApplicationCode}*'
          - Sid: EcrAuthIsAccountLevel
            Effect: Allow
            # GetAuthorizationToken takes no resource. Without it `docker
            # login` fails with an authorization error that reads like bad
            # credentials rather than a missing permission.
            Action: 'ecr:GetAuthorizationToken'
            Resource: '*'
          - Sid: ObservabilityForItsOwnWorkloads
            Effect: Allow
            Action: ['logs:*']
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationCode}*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${ApplicationCode}*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ApplicationCode}*'
          - Sid: PassOnlyItsOwnRoles
            Effect: Allow
            # iam:PassRole is the most commonly over-granted permission in AWS
            # and the usual route from "can deploy" to "can be anything": pass
            # a privileged role to a Lambda you control and the Lambda runs as
            # that role. Narrowed to roles named for this application.
            Action: 'iam:PassRole'
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApplicationCode}-*'
          # Parameters and secrets as IaC. The pipeline creates the secret
          # RESOURCE -- with a generated value (GenerateSecretString), or
          # empty for a SecretsCustodian to fill -- and never carries a
          # third-party value itself: that would put it in the repository.
          - Sid: ConfigurationItOwns
            Effect: Allow
            Action:
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              - 'ssm:GetParametersByPath'
              - 'ssm:PutParameter'
              - 'ssm:DeleteParameter'
              - 'ssm:AddTagsToResource'
              - 'ssm:ListTagsForResource'
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationCode}/*'
          - Sid: SecretsItOwns
            Effect: Allow
            Action:
              - 'secretsmanager:CreateSecret'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:PutSecretValue'
              - 'secretsmanager:UpdateSecret'
              - 'secretsmanager:TagResource'
              - 'secretsmanager:UntagResource'
              - 'secretsmanager:RotateSecret'
              - 'secretsmanager:DeleteSecret'
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationCode}/*'
          # RDS ManageMasterUserPassword creates its own secret, named rds!...,
          # with the caller's permissions. Without this an RDS template using
          # the managed password -- the right way to do it -- fails.
          - Sid: SecretsRdsManagesForIt
            Effect: Allow
            Action:
              - 'secretsmanager:CreateSecret'
              - 'secretsmanager:TagResource'
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*'
          - Sid: SecretsAndParametersDiscovery
            Effect: Allow
            Action:
              - 'secretsmanager:ListSecrets'
              - 'secretsmanager:GetRandomPassword'
              - 'ssm:DescribeParameters'
            Resource: '*'
          # The platform key, or a tenant key. A secret created with neither
          # lands on aws/secretsmanager, which platform-secret-uses-cmk flags.
          - Sid: SecretsUseACustomerManagedKey
            Effect: Deny
            Action: 'secretsmanager:CreateSecret'
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationCode}/*'
            Condition:
              'Null':
                'secretsmanager:KmsKeyArn': 'true'

          # -----------------------------------------------------------------
          # Data stores and messaging, named for the application (2026-10-02)
          # -----------------------------------------------------------------
          # Name-scoped for the reason the stacks are: two applications in one
          # account cannot reach each other's data. CloudFormation's generated
          # names begin with the stack name, which begins with the
          # application code, so unnamed resources in an ${ApplicationCode}-*
          # stack pass too.
          - Sid: DataStoresNamedForTheApplication
            Effect: Allow
            Action:
              - 's3:*'
              - 'dynamodb:*'
              - 'sqs:*'
              - 'sns:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationCode}-*/*'
              - !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:sns:*:${AWS::AccountId}:${ApplicationCode}-*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedRegions

          # RDS ARNs carry the resource TYPE and its name, and a create call
          # touches several -- the instance, its subnet group, its parameter
          # and option groups. The AWS default groups are named default.*, so
          # they are allowed for reference; the application's own are named
          # for it.
          - Sid: RelationalDatabasesNamedForTheApplication
            Effect: Allow
            Action: 'rds:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:subgrp:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-pg:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:og:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:snapshot:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-snapshot:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:default*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:cluster-pg:default*'
              - !Sub 'arn:${AWS::Partition}:rds:*:${AWS::AccountId}:og:default*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedRegions

          # The caches themselves are name-scoped. Their supporting resources
          # are not, and cannot be: when a template leaves the parameter
          # group, subnet group or user group to its default, ElastiCache
          # authorizes the create against the WILDCARD ARN
          # (parametergroup:*), not against default.redis7. Observed
          # 2026-10-02 by scripts/test-deployer-conditions.sh: a compliant,
          # encrypted CreateReplicationGroup was refused on
          # parametergroup:* until this was widened (B-153). The wildcard is
          # within this one account, and an account belongs to one
          # application, so it reaches nobody else's cache configuration.
          - Sid: CachesNamedForTheApplication
            Effect: Allow
            Action: 'elasticache:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:cluster:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:replicationgroup:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:serverlesscache:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:snapshot:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:subnetgroup:*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:parametergroup:*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:usergroup:*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:${AWS::AccountId}:user:*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedRegions

          # EFS ARNs carry a generated id, not a name, so EFS is scoped by the
          # Application tag instead: created carrying it, touched only when
          # carrying it. SCP 04 does not cover EFS, so this is the only thing
          # requiring the tag.
          - Sid: FileSystemsCreatedForTheApplication
            Effect: Allow
            Action: ['elasticfilesystem:CreateFileSystem', 'elasticfilesystem:TagResource']
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Application': !Ref ApplicationCode
                'aws:RequestedRegion': !Ref AllowedRegions
          - Sid: FileSystemsTaggedForTheApplication
            Effect: Allow
            Action: 'elasticfilesystem:*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Application': !Ref ApplicationCode

          - Sid: EventsAndAlarmsNamedForTheApplication
            Effect: Allow
            Action: ['events:*', 'cloudwatch:*']
            Resource:
              - !Sub 'arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:events:*:${AWS::AccountId}:event-bus/${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:${ApplicationCode}-*'
              - !Sub 'arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${ApplicationCode}-*'
          - Sid: MetricsHaveNoResource
            Effect: Allow
            Action: ['cloudwatch:PutMetricData', 'cloudwatch:GetMetric*', 'cloudwatch:ListMetrics', 'cloudwatch:Describe*']
            Resource: '*'

          # Security groups for the application's own resources, inside the
          # baseline VPC. Created carrying the Application tag, changed only
          # while carrying it. The baseline's groups are tagged
          # platform-managed and SCP 07 protects them whatever this says.
          # A database group opened to 0.0.0.0/0 is not refusable by IAM and
          # is a Security Hub finding instead.
          - Sid: SecurityGroupsCreatedForTheApplication
            Effect: Allow
            Action: 'ec2:CreateSecurityGroup'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:vpc/*'
              - !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedRegions
          - Sid: TagSecurityGroupsOnlyAsTheyAreCreated
            Effect: Allow
            Action: 'ec2:CreateTags'
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*'
            Condition:
              StringEquals:
                'ec2:CreateAction': CreateSecurityGroup
          - Sid: SecurityGroupsTaggedForTheApplication
            Effect: Allow
            Action:
              - 'ec2:DeleteSecurityGroup'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:ModifySecurityGroupRules'
              - 'ec2:UpdateSecurityGroupRuleDescriptions*'
            Resource: !Sub 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Application': !Ref ApplicationCode
          - Sid: SeeTheNetworkItDeploysInto
            Effect: Allow
            Action: 'ec2:Describe*'
            Resource: '*'

          # Encryption with the platform keys. CreateGrant is how RDS, EFS,
          # ElastiCache and DynamoDB take a CMK on the caller's behalf, and
          # GrantIsForAWSResource keeps the grant usable by the service only.
          # Key administration stays denied by SCP 02 whatever this says.
          - Sid: UseKeysThroughTheServices
            Effect: Allow
            Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey*', 'kms:DescribeKey']
            Resource: '*'
          - Sid: GrantKeysToServicesOnly
            Effect: Allow
            Action: 'kms:CreateGrant'
            Resource: '*'
            Condition:
              Bool:
                'kms:GrantIsForAWSResource': 'true'

          # Service-linked roles are defined by AWS, not by the tenant: their
          # permissions are fixed and cannot be widened, so creating one is
          # not the IAM authority Jamie kept back. Each data service creates
          # its own on first use in an account, and without this the FIRST
          # RDS or ElastiCache deploy in a fresh account fails on IAM.
          - Sid: ServiceLinkedRolesOnly
            Effect: Allow
            Action: 'iam:CreateServiceLinkedRole'
            Resource: '*'
            Condition:
              StringEquals:
                'iam:AWSServiceName':
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - elasticfilesystem.amazonaws.com
                  - ecs.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - dynamodb.application-autoscaling.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com
          - Sid: KnowWhoItIs
            Effect: Allow
            # sts:GetCallerIdentity is how a pipeline proves which role it
            # assumed, and it is the first thing in any useful deploy log.
            Action: 'sts:GetCallerIdentity'
            Resource: '*'

Outputs:
  AppDeployerRoleArn:
    Description: >-
      Give this to the tenant. It is the only credential they ever receive, and
      it is not a credential — it is a role ARN their pipeline assumes.
    Value: !GetAtt AppDeployerRole.Arn
  BoundaryArn:
    Value: !Ref AppDeployerBoundary
  OidcProviderArn:
    Description: >-
      Pass as ExistingOidcProviderArn for the second and subsequent
      applications in this account.
    Value: !If [MakeProvider, !Ref OidcProvider, !Ref ExistingOidcProviderArn]
  SubjectPattern:
    Description: >-
      Recorded in the outputs so that "who can deploy here" is answerable from
      the stack without reading the trust policy.
    Value: !Ref OidcSubjectPattern
