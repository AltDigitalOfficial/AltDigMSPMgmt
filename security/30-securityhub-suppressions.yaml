AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform - Security Hub automation rules that suppress
  findings the platform causes by design, each with its reason. Deployed to
  the Audit account, Security Hub's delegated administrator, where rules
  apply to findings from every member account.

# ---------------------------------------------------------------------------
# A suppression is a claim, so each one is narrow and says why
# ---------------------------------------------------------------------------
# B-147: every account opens on findings the platform itself causes, which
# buries anything the tenant causes and trains people to ignore the counts. The
# cure is not a blanket "suppress Security Hub". It is one rule per cause:
#
#   * matched as narrowly as the finding allows (control id AND resource),
#   * with the reason written into the finding's note, so whoever opens it in
#     the console reads why it is suppressed rather than guessing,
#   * here, in a template, so adding one is a reviewed change and not a click.
#
# A rule only sets the workflow status to SUPPRESSED. The finding is still
# recorded, still exported, and reappears if the rule is removed. Nothing is
# deleted.
#
# Disabling a control and suppressing its findings are different tools
# (ADR-011). A control is disabled in security/36-securityhub-policy.
# yaml only when a platform decision makes it unsatisfiable in EVERY account,
# tenants included. A finding is suppressed here when the control is right in
# general and wrong only for the platform's own resources, so a tenant's
# resource still raises it. CIS 3.x needs neither: CIS is no longer an enabled
# standard (D-032).

Parameters:

  ManagementAccountId:
    Type: String
    Description: >-
      The Organization management account, from PLATFORM_MGMT_ACCOUNT_ID in
      config/platform.env. Scopes the IAM.6 suppression to that one root.
    AllowedPattern: '^[0-9]{12}$'

Resources:

  # IAM.1 flags any customer-managed policy, once attached, that allows "*" on
  # "*". PlatformDeveloperBoundary does exactly that in its CeilingNotGrant
  # statement, on purpose: it is a PERMISSIONS BOUNDARY, so it caps what a role
  # can do and grants nothing. A role's effective permissions are the
  # intersection of its own policies and the boundary. The boundary's content
  # is its denies (baseline/80-developer-boundary.yaml). Every account that has
  # a bounded role raises this finding, so without the rule each new tenant
  # opens on a HIGH that means nothing.
  #
  # Matched on control AND resource. The resource match is CONTAINS on the
  # policy name, because the account id differs per account. Nobody outside
  # the platform can create a policy with that name: SCP 03 v2 denies creating
  # or editing policy/Platform* to anyone but the deployment principals.
  SuppressBoundaryIam1:
    Type: AWS::SecurityHub::AutomationRule
    Properties:
      RuleName: platform-suppress-iam1-developer-boundary
      RuleOrder: 10
      RuleStatus: ENABLED
      IsTerminal: false
      Description: >-
        IAM.1 on PlatformDeveloperBoundary is by design: a permissions boundary
        allows * as a ceiling and grants nothing (B-147).
      Criteria:
        ComplianceSecurityControlId:
          - { Value: IAM.1, Comparison: EQUALS }
        ResourceId:
          - { Value: ':policy/PlatformDeveloperBoundary', Comparison: CONTAINS }
        RecordState:
          - { Value: ACTIVE, Comparison: EQUALS }
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: >-
                Suppressed by platform-suppress-iam1-developer-boundary.
                PlatformDeveloperBoundary is a permissions boundary: its
                Allow * on * is a ceiling, not a grant, and its denies are the
                control. See B-147 and baseline/80-developer-boundary.yaml.
              UpdatedBy: platform-automation-rule
      # No Tags here, and not by choice. The CloudFormation schema for
      # AWS::SecurityHub::AutomationRule allows tag KEYS matching
      # ^[a-zA-Z0-9]{1,128}$ only, so platform-managed and platform-layer are
      # rejected (cfn-lint E3002). Security Hub's own TagResource API accepts
      # them. The tags are applied after deploy with
      #   aws securityhub tag-resource --resource-arn <RuleArn> \
      #     --tags platform-managed=true,platform-layer=infrastructure
      # so the CLAUDE.md layer-tag rule holds. A redeploy does not remove them:
      # CloudFormation leaves alone tags it does not manage.

  # CloudFormation.3 (termination protection) and .4 (a service role) are
  # sound for stacks someone deploys by hand. The platform's stacks are
  # deployed by StackSets and by deploy-to-account.sh. Where developers and
  # tenant pipelines work (Sandbox and Members), SCP 08 denies deleting or
  # changing StackSet-platform-* and platform-* stacks to all but the deployment
  # principals. In the Security and Infrastructure accounts no developer or
  # tenant principal has access at all, and SCP 08 is not attached. Termination
  # protection on a StackSet instance would also block the StackSet's own
  # updates and removals. 65 findings across 7 accounts on 2026-10-26, every
  # one a platform stack. A tenant's stack still raises both.
  SuppressPlatformStacksCloudFormation:
    Type: AWS::SecurityHub::AutomationRule
    Properties:
      RuleName: platform-suppress-cfn3-cfn4-platform-stacks
      RuleOrder: 20
      RuleStatus: ENABLED
      IsTerminal: false
      Description: >-
        CloudFormation.3/.4 on the platform's own stacks, deployed by
        StackSets and protected by SCP 08 where developers work (ADR-011).
      Criteria:
        ComplianceSecurityControlId:
          - { Value: CloudFormation.3, Comparison: EQUALS }
          - { Value: CloudFormation.4, Comparison: EQUALS }
        ResourceId:
          - { Value: ':stack/StackSet-platform-', Comparison: CONTAINS }
          - { Value: ':stack/platform-', Comparison: CONTAINS }
        RecordState:
          - { Value: ACTIVE, Comparison: EQUALS }
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: >-
                Suppressed by platform-suppress-cfn3-cfn4-platform-stacks. A
                platform stack, deployed by StackSet or deploy-to-account.sh.
                SCP 08 protects it where developers work; elsewhere no tenant
                principal has access. See ADR-011.
              UpdatedBy: platform-automation-rule

  # IAM.6 (hardware MFA on the root) on the management account is an accepted
  # deviation: D-006 records that the root uses a virtual authenticator and why
  # hardware tokens are not being ordered. Scoped to that one account by id, so
  # a member account's root still raises it. Member roots are denied outright
  # by SCP 03 in any case.
  SuppressManagementRootIam6:
    Type: AWS::SecurityHub::AutomationRule
    Properties:
      RuleName: platform-suppress-iam6-management-root
      RuleOrder: 30
      RuleStatus: ENABLED
      IsTerminal: false
      Description: >-
        IAM.6 on the management account root: virtual MFA is accepted
        deviation D-006.
      Criteria:
        ComplianceSecurityControlId:
          - { Value: IAM.6, Comparison: EQUALS }
        AwsAccountId:
          - { Value: !Ref ManagementAccountId, Comparison: EQUALS }
        RecordState:
          - { Value: ACTIVE, Comparison: EQUALS }
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: >-
                Suppressed by platform-suppress-iam6-management-root. Virtual
                MFA on the management root is accepted deviation D-006.
              UpdatedBy: platform-automation-rule

Outputs:
  BoundaryIam1RuleArn:
    Description: The IAM.1 suppression rule.
    Value: !GetAtt SuppressBoundaryIam1.RuleArn
