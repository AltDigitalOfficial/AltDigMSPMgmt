AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform - the secrets key in the Audit account, where
  every platform secret lives. Its key policy is the read grant: decryption
  only through Secrets Manager, and only for the named reader roles.

# ---------------------------------------------------------------------------
# Why this exists alongside the baseline's alias/platform-secrets
# ---------------------------------------------------------------------------
# baseline/30-kms-and-secrets.yaml creates alias/platform-secrets in MEMBER
# accounts, through the management-owned platform-kms-secrets StackSet. The
# platform's own secrets are not there. On 2026-10-31 all thirteen were in
# Audit and Tooling, every one under the AWS-managed aws/secretsmanager key
# (15.8 survey). Jamie ruled the same day: one copy of each secret, in Audit,
# "until someone tells me to change it". So the key is needed in Audit only,
# and as a one-off platform-account stack, not by widening the member StackSet
# to the Security OU.
#
# Same key properties as the baseline's secrets key, and the same quorum deny.
# The reasoning for the deny, and for leaving kms:PutKeyPolicy to SCP 02, is
# written out in baseline/30-kms-and-secrets.yaml and is not repeated here.
#
# ---------------------------------------------------------------------------
# Why the read grant is in the key policy, not in each reader's IAM policy
# ---------------------------------------------------------------------------
# Ten roles read secrets in Audit, across six stacks (router, commercial,
# reconciliation, quorum, evidence, HIPAA eligibility). Granting through IAM
# means redeploying all six, and re-encrypting before the last of them lands
# stops that reader. The router is one of them, so the outage would include the
# path that reports it.
#
# A key-policy grant arrives with the key in one deploy, so no ordering can be
# got wrong, and the whole read surface is in one place an auditor can read.
# Each reader's IAM policy still limits WHICH secrets it can fetch. This
# statement only lets it decrypt what Secrets Manager hands it.
#
# The roles are matched by aws:PrincipalArn rather than named as principals.
# KMS rejects a policy naming a principal that does not exist, and a stack
# being torn down and redeployed would otherwise block or break the key.
# The router's role name is CloudFormation-generated, hence a wildcard on its
# suffix. That opens nothing new: anyone able to create a role in Audit
# already holds kms:* through the root delegation.
#
# Who is NOT a reader:
#   SecurityReadOnly   denies GetSecretValue outright (identity/30-...).
#   Developers         have no access to Audit.
#   OrganizationAccountAccessRole and the StackSet execution role read and
#                      write through AdministratorAccess plus the root
#                      delegation. That is how the set-*-token scripts write,
#                      and how alerting/10-alert-topic.yaml resolves its
#                      routing keys at deploy time.

Parameters:

  QuorumExecutionRoleName:
    Type: String
    Default: PlatformQuorumExecutor
    Description: >-
      The only role permitted to disable, delete or stop rotating this key.
      Matches baseline/30-kms-and-secrets.yaml.

Resources:

  SecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Platform secrets key in Audit (Secrets Manager)
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMPolicyDelegation
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: DenyDestructiveActionsOutsideQuorum
            Effect: Deny
            Principal: '*'
            Action:
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey'
              - 'kms:DisableKeyRotation'
              - 'kms:DeleteImportedKeyMaterial'
            Resource: '*'
            Condition:
              ArnNotLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:sts::*:assumed-role/${QuorumExecutionRoleName}/*'
          # Decrypt only. No reader writes a secret, so none needs
          # GenerateDataKey. Through Secrets Manager only, so the grant is
          # not a general-purpose decrypt for anything else this key ever
          # encrypts.
          #
          # Principal '*', narrowed by kms:CallerAccount and aws:PrincipalArn,
          # and NOT the account root. A root principal in a key policy does
          # not grant: it delegates to IAM, so the role would also need
          # kms:Decrypt in its own policy, and none of the readers has it.
          # That is exactly how this statement first shipped, 2026-11-01:
          # reconciliation got AccessDeniedException on the Jira secret the
          # moment it moved, and it was moved back (ADR-019). '*' with
          # these conditions is the pattern AWS uses for its own managed keys,
          # and it grants to the matched roles directly.
          - Sid: SecretReadersViaSecretsManager
            Effect: Allow
            Principal: { AWS: '*' }
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:ViaService': !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                'kms:CallerAccount': !Ref AWS::AccountId
              ArnLike:
                'aws:PrincipalArn':
                  # Routing keys, platform and tenant (alerting/20-router.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/platform-router-RouterRole-*'
                  # Commercial routing key (commercial/10-commercial-routing.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformCommercialNotifier'
                  # Jira (change/10-reconciliation.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformChangeReconciliation'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformChangeFiler'
                  # Jira (quorum/10-quorum.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformQuorumVerify'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformQuorumExecute'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformQuorumReverse'
                  # Truveon ingest (evidence/10-evidence.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformEvidenceSender'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformEvidenceCompleteness'
                  # Tenant Jira (eligibility/10-hipaa-eligibility.yaml)
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/PlatformHipaaEligibilityTenantJira'
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: KeyPurpose,       Value: secrets }

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/platform-secrets
      TargetKeyId: !Ref SecretsKey

Outputs:

  SecretsKeyArn:
    Description: Secrets key in Audit. Pass to update-secret --kms-key-id.
    Value: !GetAtt SecretsKey.Arn
