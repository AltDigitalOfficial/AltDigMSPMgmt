AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform - the re-issue reminder for credentials that
  cannot rotate themselves. Daily, in Audit, where every platform secret
  lives (ADR-019). Reads tags, never values. ADR-020.

# ---------------------------------------------------------------------------
# Why a reminder and not rotation
# ---------------------------------------------------------------------------
# Design 04: "Where rotation is not supported (most third-party API keys), the
# defensible position is a documented rotation cadence with a named owner, plus
# detection for secrets exceeding their maximum age." The PagerDuty REST token
# and the Jira token are issued by a person in each service's console, and
# neither service has an API that would let a rotation Lambda mint a new one.
# Jamie, 2026-10-31: "we need to set a scheduled task to remind me when keys
# need to be rotated."
#
# ---------------------------------------------------------------------------
# Why tags, and not the secret's own dates
# ---------------------------------------------------------------------------
# LastRotatedDate is set only by Secrets Manager rotation, which these secrets
# never have. LastChangedDate moves on ANY write, including a write of the same
# value. The 15.8 key move (scripts/move-secret-key.sh) rewrote every secret
# on 2026-11-01, so measured that way every token would read as one day old.
# AWS's managed rule SECRETSMANAGER_SECRET_PERIODIC_ROTATION does not say which
# date it reads, so it is not relied on either.
#
# So the clock is a pair of tags on the secret:
#   platform-issued         YYYY-MM-DD, the day the credential was minted.
#                           Stamped by store_secret_everywhere (lib/common.sh)
#                           on every write of a NEW value, and set by hand with
#                           scripts/set-secret-cadence.sh.
#   platform-max-age-days   N, or "none" for a secret deliberately without a
#                           cadence (routing keys: they can only open
#                           incidents, and are replaced on compromise).
#   platform-owner          the role that re-issues it, never a person.
#                           Carried into the reminder, and it chooses the
#                           mailbox for the monthly calendar (below).
#   platform-tool           optional; what the credential is called in that
#                           calendar ("PagerDuty REST API"). The secret name
#                           when absent.
#
# ---------------------------------------------------------------------------
# The monthly calendar (ADR-021)
# ---------------------------------------------------------------------------
# Jamie, 2026-11-01: a monthly notice to the root account's mailbox, "you have
# X months until <DATE>, on which date the API key for <TOOL> needs to be
# cycled". The daily reminder only speaks in a credential's last 30 days. The
# calendar is the long view, so a re-issue is planned rather than discovered.
#
# On the 1st of each month the same function sends one email per owner, to
# SNS topic platform-owner-<owner>, listing every credential that owner holds
# a cadence for. The address is not in this template. It is subscribed by
# scripts/subscribe-secret-owner.sh, which reads it from Organizations, so
# when the root mailbox changes a re-run follows it.
#
# This is a direct email and does not pass through the router. Nothing in it
# is an event: it is a calendar, it cannot page, and its recipient was named
# by Jamie. The reminders that ARE events still go through the router.
#
# Its else paths:
#   owner topic missing, or no      -> digest, naming the owner and the count
#   confirmed subscription             of credentials whose calendar went
#                                      nowhere
#   cadence but no platform-owner   -> digest, monthly: it is in no calendar
#
# ---------------------------------------------------------------------------
# Every path ends somewhere a person sees (the else rule)
# ---------------------------------------------------------------------------
#   due in 30, 14, 7 or 1 days      -> ticket + digest, "re-issue by <date>"
#   overdue                         -> ticket + digest on the day, then weekly
#   tagged none                     -> recorded in the log, nothing raised
#   no platform-max-age-days tag    -> digest, Mondays: a secret nobody has
#                                      decided about is not silently unwatched
#   cadence but no platform-issued  -> digest, Mondays: same reasoning
#   unreadable tag values           -> digest, Mondays
#   the function itself fails       -> platform-secret-age-errors, to the router
#
# Reminders fire on exact days, not daily inside a window, so a due credential
# raises five tickets in its last month, not thirty. A failed run on one of
# those days skips that reminder. The errors alarm is what covers it.
#
# Declared digest_and_jira and digest: never a page. A credential that is
# about to expire is a task, and the emitter may only downgrade (D-028).

Parameters:

  AlertBusName:
    Type: String
    Default: platform-alerts
    Description: The organization bus in this account, where the router listens.

  LogsKeyArn:
    Type: String
    AllowedPattern: '^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
    Description: KMS key for the function's log group (Audit's logs key).

  Schedule:
    Type: String
    Default: 'cron(0 14 * * ? *)'
    Description: >-
      Daily. 14:00 UTC is 07:00 or 08:00 in Denver, so a reminder is in the
      morning digest's window rather than arriving overnight.

  MonthlySchedule:
    Type: String
    Default: 'cron(0 14 1 * ? *)'
    Description: The monthly calendar email. The 1st, at the daily run's hour.

Resources:

  # One topic per owner role. A new owner is a new topic here, named
  # platform-owner-<role>, plus scripts/subscribe-secret-owner.sh. The
  # AWS-managed SNS key, as for the HIPAA tenant alert topic: email delivery
  # and a same-account Lambda both work with it.
  OperationsOwnerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: platform-owner-platform-operations
      DisplayName: AltDigital platform operations
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

  SecretAgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PlatformSecretAge
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

  SecretAgePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ListSecretsAndRaise
      Roles: [!Ref SecretAgeRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ListSecrets returns names, dates and tags. Never values: this role
          # has no GetSecretValue and is not in the secrets key's policy.
          - Sid: ListSecretMetadata
            Effect: Allow
            Action: secretsmanager:ListSecrets
            Resource: '*'
          - Sid: RaiseOnTheAlertBus
            Effect: Allow
            Action: events:PutEvents
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${AlertBusName}'
          # The calendar. ListSubscriptionsByTopic so an unconfirmed mailbox
          # is reported rather than published into silently.
          - Sid: MailOwners
            Effect: Allow
            Action: ['sns:Publish', 'sns:ListSubscriptionsByTopic']
            Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:platform-owner-*'

  SecretAgeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/platform-secret-age
      RetentionInDays: 2557
      KmsKeyId: !Ref LogsKeyArn

  SecretAgeFunction:
    Type: AWS::Lambda::Function
    DependsOn: SecretAgeLogGroup
    Properties:
      FunctionName: platform-secret-age
      Description: Reminds before a hand-issued credential falls due, and sends the monthly calendar. ADR-020, ADR-021.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SecretAgeRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          ALERT_BUS_NAME: !Ref AlertBusName
          OWNER_TOPIC_PREFIX: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:platform-owner-'
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }
      Code:
        # Inline: one list call and one decision per secret. Tested by
        # scripts/test-secret-age.py, which loads this exact text.
        ZipFile: |
          import datetime
          import json
          import os

          import boto3

          REMIND_DAYS = (30, 14, 7, 1)

          _clients = {}


          def _client(name):
              if name not in _clients:
                  _clients[name] = boto3.client(name)
              return _clients[name]


          def assess(name, tags, today):
              """(kind, routing, detail-or-None). kind names the path taken."""
              max_age = (tags.get("platform-max-age-days") or "").strip()
              issued = (tags.get("platform-issued") or "").strip()
              monday = today.weekday() == 0
              if max_age.lower() == "none":
                  return "no-cadence-by-decision", None, None
              if not max_age:
                  return "untagged", ("digest" if monday else None), (
                      "has no platform-max-age-days tag. Decide its re-issue cadence, "
                      "or tag it none, with scripts/set-secret-cadence.sh.")
              try:
                  days = int(max_age)
                  if days <= 0:
                      raise ValueError
              except ValueError:
                  return "bad-tag", ("digest" if monday else None), (
                      f"platform-max-age-days is {max_age!r}, not a positive number of days or none.")
              if not issued:
                  return "no-issue-date", ("digest" if monday else None), (
                      "has a cadence but no platform-issued date, so its age cannot be known. "
                      "Set it with scripts/set-secret-cadence.sh --issued YYYY-MM-DD.")
              try:
                  issued_on = datetime.date.fromisoformat(issued)
              except ValueError:
                  return "bad-tag", ("digest" if monday else None), (
                      f"platform-issued is {issued!r}, not a YYYY-MM-DD date.")
              due = issued_on + datetime.timedelta(days=days)
              left = (due - today).days
              if left in REMIND_DAYS:
                  return f"due-in-{left}", "digest_and_jira", (
                      f"falls due {due.isoformat()}, in {left} day{'s' if left != 1 else ''}. "
                      f"Issued {issued}, cadence {days} days.")
              if left <= 0 and (-left) % 7 == 0:
                  return "overdue", "digest_and_jira", (
                      f"was due {due.isoformat()} and is {-left} day{'s' if left != -1 else ''} overdue. "
                      f"Issued {issued}, cadence {days} days.")
              return "ok", None, None


          def dossier(secret, tags, routing, text, kind):
              name = secret["Name"]
              owner = tags.get("platform-owner")
              reissue = kind.startswith("due") or kind == "overdue"
              return {
                  "record_type": "secret-age",
                  "recorded_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "alarm": {
                      "name": ("Re-issue credential: " if reissue else "Secret hygiene: ") + name,
                      "account_id": secret.get("ARN", "::::").split(":")[4],
                      "resource_id": name,
                  },
                  "assessment": {
                      "probable_cause": f"{name} {text}" + (f" Owner: {owner}." if owner else ""),
                  },
                  "current_state": kind,
                  "routing": routing,
                  "routing_reason": (
                      "re-issue reminder: a task, never a page (ADR-020)" if reissue
                      else "hygiene notice, weekly (ADR-020)"),
              }


          def _secrets():
              kwargs = {}
              while True:
                  page = _client("secretsmanager").list_secrets(**kwargs)
                  for s in page.get("SecretList", []):
                      yield s, {t["Key"]: t["Value"] for t in s.get("Tags") or []}
                  if not page.get("NextToken"):
                      return
                  kwargs["NextToken"] = page["NextToken"]


          def _raise(raised):
              for i in range(0, len(raised), 10):
                  resp = _client("events").put_events(Entries=[{
                      "EventBusName": os.environ["ALERT_BUS_NAME"],
                      "Source": "platform.secrets",
                      "DetailType": "Platform Incident Dossier",
                      "Detail": json.dumps(d),
                  } for d in raised[i:i + 10]])
                  if resp.get("FailedEntryCount"):
                      # Raised, so the errors alarm fires: a reminder that
                      # fails quietly is a token that expires unannounced.
                      raise RuntimeError(f"PutEvents failed: {resp.get('Entries')}")


          def due_date(tags):
              """The due date, or None for anything the daily run reports instead."""
              try:
                  days = int((tags.get("platform-max-age-days") or "").strip())
                  issued = datetime.date.fromisoformat((tags.get("platform-issued") or "").strip())
              except ValueError:
                  return None
              return issued + datetime.timedelta(days=days) if days > 0 else None


          def months_until(today, due):
              """Whole calendar months from today to due."""
              months = (due.year - today.year) * 12 + (due.month - today.month)
              return months - 1 if due.day < today.day else months


          def calendar_line(tool, due, today):
              on = f"{due.day} {due:%B %Y}"
              left = (due - today).days
              if left < 0:
                  return (f"The API key for {tool} was due to be cycled on {on}, "
                          f"{-left} day{'s' if left != -1 else ''} ago. It is overdue.")
              months = months_until(today, due)
              if months < 1:
                  return (f"You have less than a month until {on}, on which date the API key "
                          f"for {tool} needs to be cycled. Daily reminders in the digest and "
                          f"Jira have started.")
              return (f"You have {months} month{'s' if months != 1 else ''} until {on}, on which "
                      f"date the API key for {tool} needs to be cycled.")


          def _confirmed(topic_arn):
              """True, False (no confirmed subscriber), or None (no topic)."""
              try:
                  # One page is up to 100 subscriptions; an owner topic has one.
                  subs = _client("sns").list_subscriptions_by_topic(
                      TopicArn=topic_arn).get("Subscriptions", [])
              except Exception as exc:                          # noqa: BLE001
                  if "NotFound" in type(exc).__name__ or "NotFound" in str(exc):
                      return None
                  raise
              return any(s.get("SubscriptionArn", "").startswith("arn:") for s in subs)


          def monthly(today):
              by_owner, raised = {}, []
              for s, tags in _secrets():
                  due = due_date(tags)
                  if due is None:
                      continue        # no cadence, or tags the daily run reports
                  owner = (tags.get("platform-owner") or "").strip()
                  if not owner:
                      raised.append(dossier(s, tags, "digest",
                          "has a cadence but no platform-owner, so it is in no monthly "
                          "calendar. Set one with scripts/set-secret-cadence.sh --owner.",
                          "no-owner"))
                      continue
                  tool = (tags.get("platform-tool") or "").strip() or s["Name"]
                  by_owner.setdefault(owner, []).append((due, tool, s["Name"]))

              sent = []
              for owner, rows in sorted(by_owner.items()):
                  rows.sort()
                  arn = os.environ["OWNER_TOPIC_PREFIX"] + owner
                  state = _confirmed(arn)
                  if not state:
                      why = "has no topic" if state is None else "has no confirmed email subscription"
                      raised.append(dossier({"Name": f"platform-owner-{owner}", "ARN": arn}, {}, "digest",
                          f"{why}, so this month's calendar for {len(rows)} credential"
                          f"{'s' if len(rows) != 1 else ''} was not delivered. Run "
                          f"scripts/subscribe-secret-owner.sh {owner}, then confirm the email.",
                          "owner-mailbox"))
                      continue
                  body = "\n\n".join(
                      f"{calendar_line(tool, due, today)}\n  (secret {name}, Audit account)"
                      for due, tool, name in rows)
                  body += (
                      "\n\nRe-issue in the vendor's console, then store the new value with the "
                      "script named in the secret's description. Storing it restarts the clock."
                      "\n\nSent on the 1st of each month by platform-secret-age in the Audit "
                      f"account to the {owner} role (ADR-021). In the 30 days before a due "
                      "date, reminders also arrive in the digest and as Jira tickets.")
                  _client("sns").publish(
                      TopicArn=arn,
                      Subject=f"Credential calendar: next re-issue {rows[0][0].isoformat()}",
                      Message=body)
                  sent.append({"owner": owner, "credentials": [n for _, _, n in rows]})

              _raise(raised)
              out = {"record_type": "secret-calendar-run", "date": today.isoformat(),
                     "sent": sent, "raised": len(raised)}
              print(json.dumps(out))
              return out


          def handler(event=None, context=None, today=None):
              today = today or datetime.datetime.now(datetime.timezone.utc).date()
              if (event or {}).get("mode") == "monthly":
                  return monthly(today)
              raised, seen = [], []
              for s, tags in _secrets():
                  kind, routing, text = assess(s["Name"], tags, today)
                  seen.append({"secret": s["Name"], "kind": kind})
                  if routing:
                      raised.append(dossier(s, tags, routing, text, kind))
              _raise(raised)
              out = {"record_type": "secret-age-run", "date": today.isoformat(),
                     "secrets": seen, "raised": len(raised)}
              print(json.dumps(out))
              return out

  SecretAgeScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: platform-secret-age
      Description: Daily re-issue reminder for hand-issued credentials. ADR-020.
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      Targets:
        - Id: secret-age
          Arn: !GetAtt SecretAgeFunction.Arn

  SecretAgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecretAgeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SecretAgeScheduleRule.Arn

  SecretCalendarRule:
    Type: AWS::Events::Rule
    Properties:
      Name: platform-secret-calendar
      Description: Monthly credential calendar email to each owner role. ADR-021.
      ScheduleExpression: !Ref MonthlySchedule
      State: ENABLED
      Targets:
        - Id: secret-calendar
          Arn: !GetAtt SecretAgeFunction.Arn
          Input: '{"mode": "monthly"}'

  SecretCalendarPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecretAgeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SecretCalendarRule.Arn

  # Delivered by the router (D-028), never directly.
  SecretAgeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: platform-secret-age-errors
      AlarmDescription: >-
        The re-issue reminder failed. A credential may fall due without a
        reminder. Invoke platform-secret-age in Audit by hand and read its
        log: the run record lists every secret and what was decided for it.

        [platform-routing] routing=digest_and_jira layer=infrastructure urgency=low
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SecretAgeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:

  FunctionName:
    Value: !Ref SecretAgeFunction
