# AltDigital Managed Platform — runbook catalog
#
# ===========================================================================
# THIS IS DATA. The framework is generic; this file is what it does.
# ===========================================================================
#
# Prompt 5.1: "Structure it so that a runbook is defined by data — (alarm type
# x resource type) mapped to a set of stage 1 gather actions, stage 2
# remediations, stage 3 remediations — and the framework handles staging,
# revalidation, safety rails and dossier assembly generically."
#
# So adding a runbook is an entry here. It is never a code change, and it is
# never a new SSM document: there is ONE automation document and it is driven
# by this file.
#
# ---------------------------------------------------------------------------
# The key is (alarm × resource), not alarm alone
# ---------------------------------------------------------------------------
# Design doc 07: "Every runbook is the same four-stage escalation, keyed to
# (alarm type × resource type)."
#
# The distinction matters. "CPU high" on an EC2 instance and "CPU high" on an
# RDS instance share a name and share nothing else — one might warrant clearing
# a log volume, the other a connection-pool inspection. Keying on the alarm
# alone would force every action to re-derive the resource type at runtime,
# which is the switch statement this format exists to avoid.
#
# Alarm ids are 06a's, so this file and design/06a-alarm-specification.yaml
# refer to the same things by the same names.
#
# ---------------------------------------------------------------------------
# What is permitted, and what was refused
# ---------------------------------------------------------------------------
# Doc 07 and CLAUDE.md disagreed about stage 3. Doc 07 permits cycling an ECS
# task, draining and replacing an instance, restarting a service on a fleet and
# failing over an RDS replica. CLAUDE.md says "never write code that
# terminates, deletes, deregisters, rolls back or purges a resource as part of
# automated remediation. Operational automation is additive or reversible."
#
# Resolved action by action on 2026-09-18, because the four are not equivalent
# — two of them destroy no AWS resource at all. Recorded as D-013.
#
# THE TEST THAT MATTERS IS REVERSIBILITY, NOT COST. An earlier draft of this
# file refused scale-out on the grounds that it creates cost, which applied a
# stricter standard than CLAUDE.md's own "additive or reversible" and bundled
# it with RDS storage expansion. The two are not alike:
#
#   scale out             additive, reversible, and capped by the circuit
#                         breaker at three in an hour.
#   expand RDS storage    additive, and AWS DOES NOT PERMIT SHRINKING ALLOCATED
#                         STORAGE. Ever. A runaway log therefore raises the
#                         floor of that customer's bill permanently.
#
# Cost is a consequence; irreversibility is the property. Refusing on the
# consequence produced an inconsistent catalog and an argument that would not
# survive being questioned — which is what happened.
#
#   PERMITTED
#     clear log files       stage 2. Deletes files, not a resource. No cost.
#     scale out             stage 2, and ONLY where the target can scale itself
#                           back in. Reversible in principle is not the same as
#                           self-reversing: on a fixed desired count the
#                           automation adds capacity and nothing ever removes
#                           it. requires_scale_in_policy is checked BEFORE
#                           acting, the same shape as the redundancy check.
#     restart a service     stage 3. A process, via SSM Run Command. Nothing in
#                           AWS is destroyed, and a restart is fast.
#     cycle an ECS task     stage 3. The task dies, the service does not. Jamie
#                           judged a task closer to a process than a resource.
#
#   REFUSED, with what would change the answer
#     expand a volume       irreversible, per above. Nothing changes this; it is
#                           a property of the AWS API, not a policy choice.
#     release stuck DB
#       connections         needs credentials the platform deliberately does not
#                           hold, and identifying a genuinely stuck connection is
#                           not something we can do confidently yet. Potentially
#                           disruptive to real production users.
#     flush a cache         doc 07 calls this non-destructive. It is not: a
#                           flushed production cache stampedes the backend, and
#                           the stampede can be worse than the memory pressure it
#                           relieved. Held pending a decision.
#     RDS failover          not destructive, and SLOW enough to be an outage in
#                           its own right. Refused until there is data on how
#                           long, on real instances, in this platform.
#     drain and replace
#       an LB instance      hits two of CLAUDE.md's named verbs outright, and the
#                           recovery story is "hope the ASG launches a healthy
#                           one". Refused until there is data.
#
# "No for now" and "no forever" are different, and a catalog that cannot tell
# them apart accumulates the wrong kind of caution.

schema_version: 1

# ---------------------------------------------------------------------------
# Stage 1 — gather. Always runs, always read-only.
# ---------------------------------------------------------------------------
# Doc 07 lists six gather actions and singles one out: "Was there a deployment
# or configuration change in the last 30 minutes? ... That deployment question
# resolves a large share of real incidents on its own."
#
# So `recent_changes` is in the default set for every runbook rather than being
# something each one opts into. A gather step nobody remembered to add is a
# dossier that omits the answer most likely to be the answer.
# ---------------------------------------------------------------------------
# Failure handling — "the fix didn't fix"
# ---------------------------------------------------------------------------
# Jamie, 2026-09-18: "if extending something didn't fix it, even if it's
# reversible, we should still escalate to a human ... tried this 3x, still
# having problems, page out."
#
# Three conditions, deliberately kept apart, because collapsing them loses the
# signal that distinguishes them:
#
#   escalate_on_failure     A remediation ran, the settle period passed, the
#                           alarm is STILL breaching. Escalate to the next
#                           stage. Do NOT retry the same action — clearing logs
#                           that did not drop disk usage will not drop it on a
#                           second attempt, and retrying is how automation
#                           spends ten minutes failing at something a human
#                           would have diagnosed.
#
#   failed_attempt_limit    The same action has failed on the same resource
#                           this many times in the window. Stop attempting it
#                           at all and page. A SHORTER fuse than the circuit
#                           breaker, because every failed attempt is time
#                           during which nobody is looking at a real incident.
#
#   circuit breaker         06a's rail: the same remediation fired three times
#                           in an hour REGARDLESS OF OUTCOME. Note it counts
#                           successes too, and doc 07 says why — "repeated
#                           automated repair is masking a real fault". Three
#                           successful log clears in an hour means something is
#                           writing logs pathologically and the fix is hiding
#                           it.
#
# Failure gets the shorter fuse. Success three times is a fault being masked;
# failure twice is automation flailing.
failure_policy:
  escalate_on_failure: true
  failed_attempt_limit: 2      # same action, same resource, within the window
  window_seconds: 3600

# ---------------------------------------------------------------------------
# Settle periods
# ---------------------------------------------------------------------------
# How long to wait after an action before revalidating the alarm.
#
# Without this the failure logic fires spuriously on exactly the remediations
# that work slowly. Scaling out does not take effect the moment the API returns
# — capacity has to start, pass health checks and begin absorbing load — so
# revalidating immediately would report "did not fix" on something that is
# working, escalate unnecessarily, and eventually trip a breaker on an action
# that was never failing.
#
# Values are the time for the EFFECT to become visible in the metric, not the
# time for the API call to return. A CloudWatch metric on a 300-second period
# cannot show a change faster than its own period, which is the floor here.
settle_seconds:
  clear_log_files: 120     # disk metrics refresh quickly once space is freed
  scale_out: 600           # start, health-check, then absorb load
  restart_service: 180     # process up, plus a metric period to show it
  cycle_ecs_task: 300      # task placement, health check, drain of the old
  default: 300

default_gather:
  - metrics_window          # the alarm's metric either side of the trigger
  - recent_changes          # CloudTrail writes in the last 30 minutes
  - resource_configuration  # current config, via Config
  - alarm_history           # has this fired recently, and how did it resolve
  - related_health          # other platform alarms on the same resource

runbooks:

  # -------------------------------------------------------------------------
  "AWS::EC2::Instance":

    ec2-disk-high:
      description: >
        Filesystem approaching full. 06a names the remediation runbook for this
        one explicitly (remediation_runbook: ec2-disk-exhaustion).

        The clearest case in the catalog: a known cause, a bounded fix, and
        nothing destroyed that anyone wants.
      gather:
        - disk_usage_by_mount   # which filesystem, not just "a filesystem"
      stage_2:
        - action: clear_log_files
          # Rotated and compressed logs only. NEVER the live log — truncating
          # it breaks the writer's file handle and destroys the diagnostic
          # evidence for the incident currently being diagnosed.
          #
          # Deleting FILES is not deleting a RESOURCE. CLAUDE.md's rule names
          # resources; a rotated log is neither a resource nor something anyone
          # wants.
          parameters:
            paths: ['/var/log/*.gz', '/var/log/*.1', '/var/log/*.old']
            min_age_days: 3
            journald_vacuum_size: 200M
      stage_3: []

    ec2-cpu-high:
      description: >
        Sustained high CPU. Almost never actionable without knowing what
        changed, which is why this entry adds no action and leans entirely on
        the gather stage.

        Deliberately no restart. High CPU is as likely to be legitimate load as
        a fault, and restarting a busy service to fix busyness is how an
        automation turns a slow day into an outage.
      gather: []
      stage_2: []
      stage_3: []

    ec2-memory-high:
      description: >
        Memory exhaustion on an instance. The classic case for a service
        restart: a leak grows monotonically, a restart returns it to baseline,
        and nothing in AWS is destroyed.

        Note this alarm only exists at uat and prod in 06a and carries a [TUNE]
        threshold, so it will not fire until somebody sets one. Correct rather
        than unfortunate — an automated restart keyed to a number nobody chose
        is worse than no automation.
      gather:
        - top_processes_by_memory   # WHAT is leaking, in the dossier
      stage_2: []
      stage_3:
        - action: restart_service
          # SSM Run Command against a named service. Destroys no AWS resource,
          # which is why it survives CLAUDE.md's rule on a careful reading: the
          # rule names resources, and a process is not one.
          #
          # requires_redundancy stays true. A restart is brief but not
          # instantaneous, and on a single-instance service "brief" is still an
          # outage the customer sees.
          requires_redundancy: true
          parameters:
            service_name_tag: platform-managed-service

    ec2-status-check-failed:
      description: >
        Instance unreachable at the hypervisor level. Stage 2 has nothing safe
        to offer — the remedies are all restart-shaped, which is stage 3 by
        definition.
      gather: []
      stage_2: []
      stage_3: []

  # -------------------------------------------------------------------------
  "AWS::RDS::DBInstance":

    rds-storage-low:
      description: >
        Free storage below the tier threshold. Storage EXPANSION is the
        textbook stage 2 action here — idempotent, no user impact, and
        explicitly listed in doc 07 as "expand the volume".

        Not enabled, because it spends money without asking. An automated
        action that increases a customer's bill is a commercial decision
        wearing an operational costume, and the size of it is unbounded — a
        runaway log will expand storage repeatedly until someone notices the
        invoice. See B-029.
      gather:
        - storage_trend         # is this a cliff or a slope
      stage_2: []
      stage_3: []

    rds-connections-high:
      description: >
        Connection count near the instance maximum. Doc 07 lists "release
        stuck database connections" as a stage 2 action; doing so requires
        credentials to the database itself, which the platform deliberately
        does not hold.
      gather:
        - connection_trend
      stage_2: []
      stage_3: []

  # -------------------------------------------------------------------------
  "AWS::ECS::Service":

    ecs-cpu-high:
      description: >
        Sustained CPU across the service's tasks. The one place scale-out is
        unambiguous: the target is the service itself, and Application Auto
        Scaling either can or cannot scale it back in, which is checkable.
      gather:
        - ecs_task_cpu_by_task
      stage_2:
        - action: scale_out
          # Reversible is not the same as SELF-reversing. Without a scale-in
          # policy the automation adds tasks and nothing ever removes them —
          # reversible in principle, permanent in practice until someone
          # notices the bill. Verified before acting, not after; if the service
          # cannot scale itself back down, this runbook gathers and escalates
          # instead.
          requires_scale_in_policy: true
          parameters:
            increment: 1
      stage_3: []

    ecs-memory-high:
      description: >
        A task approaching its memory limit. Cycling returns memory to baseline
        while the service keeps serving from its other tasks.

        THIS is where task cycling belongs, not on the flapping alarms below. A
        container leaking memory is alive and degraded; cycling fixes it.
      gather:
        - ecs_task_memory_by_task
      stage_2: []
      stage_3:
        - action: cycle_ecs_task
          # Stops one task; the service's desired count brings a replacement.
          # Jamie's judgement, 2026-09-18: a task is closer to a process than to
          # a resource, so this is permitted where CLAUDE.md would forbid
          # terminating an instance. See D-013.
          requires_redundancy: true
          parameters:
            max_tasks_per_run: 1

    ecs-running-vs-desired:
      description: >
        Running task count below desired. 06a names ecs-task-flapping as the
        remediation runbook.

        NO CYCLING HERE, and this is the important one. Running below desired
        means ECS is ALREADY trying to start tasks and failing. Stopping another
        adds to the deficit and races the scheduler — the automation would be
        competing with the thing trying to fix the problem.
      gather:
        - ecs_stopped_task_reasons   # why they are dying, which is the answer
        - ecs_service_events
      stage_2: []
      stage_3: []

    ecs-task-restart-rate:
      description: >
        Tasks restarting faster than the tier threshold. Same runbook name in
        06a, same reasoning as above and more strongly: the alarm says tasks are
        already cycling too often, so cycling one is indistinguishable from the
        fault.

        This is the circuit breaker's own scenario, written as an alarm.
      gather:
        - ecs_stopped_task_reasons
        - ecs_service_events
      stage_2: []
      stage_3: []

  # -------------------------------------------------------------------------
  "AWS::Lambda::Function":

    lambda-error-rate:
      description: >
        Error rate above the tier threshold. The gather stage is the whole
        value: recent_changes answers it more often than not, because a Lambda
        error rate that moves is almost always a deployment.
      gather:
        - recent_invocation_errors   # the actual exceptions, not the count
      stage_2: []
      stage_3: []
