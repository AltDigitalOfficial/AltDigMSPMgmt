AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform — instrumentation digest sender. Batched, per
  account, to the application owner's named contact. Deployed to the Platform
  Tooling account.

# ---------------------------------------------------------------------------
# Prerequisite: a verified SES identity
# ---------------------------------------------------------------------------
# SES will not send from an unverified domain, and verifying altdigital.ai
# requires DNS records that only someone with access to the zone can add. That
# is an operator action, not something this template can do.
#
# Until it exists, deploy with DigestSender empty: the Lambda runs, gathers,
# renders, and logs what it would have sent without calling SES. That is a
# genuinely useful state — the content can be reviewed before a single message
# reaches a client's technical contact, and getting that wrong in front of a
# customer is harder to undo than a missing email.
#
# ---------------------------------------------------------------------------
# Why this is central and not per-account
# ---------------------------------------------------------------------------
# One SES identity, one sending domain, one reputation. A sender in every
# member account would need a verified identity per tenant — and SES sending
# reputation is per-identity, so a tenant whose contact has rotted would be
# quietly damaging a reputation nobody is watching.
#
# It also puts the registry lookup local: Tooling holds the registry, which is
# where the contacts are.

Parameters:

  ArtifactBucket:
    Type: String
    Description: Artifact bucket holding the digest package.

  ArtifactKey:
    Type: String
    Description: >-
      Content-addressed package key. The hash is in the key because
      CloudFormation compares S3Key to decide whether to update a function.

  RegistryTable:
    Type: String
    Default: platform-registry
    Description: Registry table. Supplies the account list and the contacts.

  DigestSender:
    Type: String
    Default: ''
    Description: >-
      Verified SES address messages are sent FROM, e.g.
      platform@altdigital.ai.

      Empty puts the Lambda in a report-only mode: it gathers and renders and
      logs, and calls no SES API. Deliberately the default — the first digest a
      client's technical contact receives should be one somebody has read.

  DigestCc:
    Type: String
    Default: ''
    Description: >-
      AltDigital address CC'd on every digest.

      Design doc 06: "The CC to AltDigital means a bounce or a departed contact
      is visible to us rather than lost." Without it a rotted contact is
      invisible — the send succeeds, the mailbox is gone, and the evidence
      trail says we communicated when we did not.

  WindowHours:
    Type: Number
    Default: 24
    AllowedValues: [24, 168]
    Description: >-
      Digest window. 24 for daily, 168 for weekly. Design doc 06 allows either
      per account; the schedule below must be changed to match.

  ScheduleExpression:
    Type: String
    Default: 'cron(0 13 * * ? *)'
    Description: >-
      When the digest runs. Default 13:00 UTC every day — morning in US
      Central. Must tile with WindowHours: each run looks back exactly
      WindowHours, so a 24-hour window needs a run every 24 hours.

      This was weekdays only until 2026-10-07. With a 24-hour window that left
      Friday 13:00 to Sunday 13:00 in no digest at all, and a dev team that
      works weekends was invisible for two days a week. Weekend digests get
      skimmed on Monday, but a skimmed line is still on record and an unreported
      one is not.

  EvidenceBucket:
    Type: String
    Default: ''
    Description: >-
      Object Lock archive receiving the send records.

      Prompt 4.4 wants these in Truveon with timestamp and recipient. Truveon
      does not exist, so they go to the immutable archive — arguably their
      right home regardless, since the record is the evidence that monitoring
      requirements were communicated and an auditor will want it unalterable.
      The Truveon hand-off stays outstanding rather than silently skipped.

Conditions:
  HasSender: !Not [!Equals [!Ref DigestSender, '']]

Resources:

  # Platform Tooling has no logs key of its own — alias/platform-logs is
  # created by the MEMBER baseline, which does not reach platform accounts. So
  # one is created here, under the same alias, so the convention holds
  # everywhere and a future reporting stack in this account has a key to use.
  LogsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts platform log groups in the Tooling account
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMPolicyDelegation
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          # CloudWatch Logs encrypts with the key on the service's own behalf,
          # so the grant is to the regional logs service principal and scoped
          # by the log group ARN it is acting for. Without the EncryptionContext
          # condition this would let the service encrypt for any log group in
          # the account.
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.amazonaws.com' }
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
      Tags:
        - { Key: platform-managed, Value: 'true' }

  LogsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/platform-logs
      TargetKeyId: !Ref LogsKey

  # -------------------------------------------------------------------------
  # Bounce handling
  # -------------------------------------------------------------------------
  # Prompt 4.4: "a bounced digest is a finding, because it means the contact
  # has rotted."
  #
  # Without a configuration set SES accepts the message, the recipient's server
  # rejects it, and nothing here ever learns. The send looks successful, the
  # evidence record says a digest was delivered, and the claim that monitoring
  # requirements were communicated is false — which is worse than not sending,
  # because it is a false record rather than an absent one.
  DigestConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Condition: HasSender
    Properties:
      Name: platform-digest
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true

  BounceTopic:
    Type: AWS::SNS::Topic
    Condition: HasSender
    Properties:
      TopicName: platform-digest-bounces
      DisplayName: Digest bounces and complaints

  BounceTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasSender
    Properties:
      Topics: [!Ref BounceTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSesToPublish
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: 'sns:Publish'
            Resource: !Ref BounceTopic
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref AWS::AccountId

  DigestEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasSender
    Properties:
      ConfigurationSetName: !Ref DigestConfigurationSet
      EventDestination:
        Name: bounces-and-complaints
        Enabled: true
        # REJECT and RENDERING_FAILURE are included alongside the obvious two.
        # A rejected or unrenderable message never reaches anyone either, and
        # treating only BOUNCE as failure would leave those silent.
        MatchingEventTypes:
          - BOUNCE
          - COMPLAINT
          - REJECT
          - RENDERING_FAILURE
        SnsDestination:
          TopicARN: !Ref BounceTopic

  # The SNS topic above has no subscriber, so on its own a bounce published
  # there reached nobody (B-155). This second destination turns the same events
  # into CloudWatch metrics so the DigestBouncedAlarm below can route them
  # through the router like every other platform event. No new code, and no
  # router change.
  #
  # The dimension value is fixed: no message carries a "configuration-set"
  # tag, so every event takes the default. One metric series per event type,
  # for this configuration set only.
  DigestMetricsDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasSender
    Properties:
      ConfigurationSetName: !Ref DigestConfigurationSet
      EventDestination:
        Name: bounce-metrics
        Enabled: true
        # RENDERING_FAILURE is left out here (it stays on the SNS destination):
        # it applies only to SES templates, and the digest sends Simple
        # content, so it cannot occur.
        MatchingEventTypes:
          - BOUNCE
          - COMPLAINT
          - REJECT
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: configuration-set
              DimensionValueSource: messageTag
              DefaultDimensionValue: platform-digest

  # -------------------------------------------------------------------------
  # Sender
  # -------------------------------------------------------------------------
  DigestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PlatformDigestSender
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendDigests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Attribute-level, because the registry holds real people's
              # contact addresses and the digest needs two of the six. A CLIENT
              # record also carries breach, security, change-approver and
              # IP-owner contacts; this function has no reason to see them, so
              # IAM refuses any query that would return them. The list must
              # match ACCOUNT_ATTRIBUTES / CLIENT_ATTRIBUTES in digest.py, plus
              # the table and index key attributes.
              #
              # SPECIFIC_ATTRIBUTES is what makes the attribute list binding: a
              # query with no projection selects ALL_ATTRIBUTES and is denied
              # here, rather than quietly returning the whole record.
              - Effect: Allow
                Action: ['dynamodb:Query']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RegistryTable}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RegistryTable}/index/*'
                Condition:
                  ForAllValues:StringEquals:
                    'dynamodb:Attributes':
                      - PK
                      - SK
                      - record_type
                      - baseline_version
                      - account_id
                      - kind
                      - partner
                      - client
                      - app
                      - environment
                      - state
                      - slug
                      - tech_contact
                      - dev_manager
                  StringEqualsIfExists:
                    'dynamodb:Select': SPECIFIC_ATTRIBUTES
              # The registry table is encrypted with its own key
              # (alias/platform-registry), and every read needs DynamoDB to
              # decrypt with it on this role's behalf. Missing from 2026-09-18
              # until 2026-10-07, so every scheduled run failed on its first
              # query.
              #
              # Two conditions keep this from being a general decrypt grant:
              # kms:ViaService means only DynamoDB can use it for this role,
              # and kms:ResourceAliases names the key by alias, so no key id is
              # hard-coded here and no other key qualifies. The key encrypts
              # the whole table; which attributes come back is decided by the
              # Query statement above, not here.
              - Effect: Allow
                Action: ['kms:Decrypt', 'kms:DescribeKey']
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                  ForAnyValue:StringEquals:
                    'kms:ResourceAliases': alias/platform-registry
              # Assume the narrow reader role in member accounts. Named
              # explicitly rather than wildcarded across roles: this function
              # may assume PlatformDigestReader and nothing else, so a
              # compromise of it cannot reach OrganizationAccountAccessRole.
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/PlatformDigestReader'
              - Effect: Allow
                Action: ['ses:SendEmail']
                Resource: '*'
              - Effect: Allow
                Action: ['s3:PutObject']
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucket}/digest-evidence/*'
              # The archive's key lives in Log Archive, so S3 needs this role's
              # permission as well as the key policy's to encrypt each record.
              # Missing until 2026-10-13. The key is not named: the encryption
              # context pins it to the evidence bucket, and kms:ViaService to S3,
              # so this cannot encrypt anything else or reach KMS directly.
              - Effect: Allow
                Action: ['kms:GenerateDataKey']
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:*:key/*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'
                    'kms:EncryptionContext:aws:s3:arn': !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucket}'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/platform-digest*'
      Tags:
        - { Key: platform-managed, Value: 'true' }

  DigestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: platform-digest
      Runtime: python3.13
      Handler: digest.handler
      Role: !GetAtt DigestRole.Arn
      # One assume-role plus two paginated reads per account, serially. Minutes
      # at forty accounts. A timeout part way leaves some clients digested and
      # others not, with no record of which — so the budget is generous.
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref RegistryTable
          DIGEST_SENDER: !Ref DigestSender
          DIGEST_CC: !Ref DigestCc
          READER_ROLE_NAME: PlatformDigestReader
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          WINDOW_HOURS: !Ref WindowHours
          SES_CONFIGURATION_SET: !If [HasSender, !Ref DigestConfigurationSet, '']
      Tags:
        - { Key: platform-managed, Value: 'true' }

  DigestLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/platform-digest
      RetentionInDays: 90
      KmsKeyId: !GetAtt LogsKey.Arn

  DigestScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: platform-digest-schedule
      Description: Batched instrumentation digest, per account.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: digest
          Arn: !GetAtt DigestFunction.Arn

  DigestSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DigestFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DigestScheduleRule.Arn

  # -------------------------------------------------------------------------
  # Watching the watcher
  # -------------------------------------------------------------------------
  # Found 2026-10-07: every scheduled run from at least 2026-09-28 failed on
  # its first registry read, and nothing said so. The digest is the evidence
  # that monitoring requirements were communicated, so a digest that is not
  # going out leaves no record that we told the client, and nobody hears about it.
  #
  # Two signals, because either alone misses one way of failing:
  #   - Errors: the function crashed before it digested anyone (the 09-28
  #     KMS failure).
  #   - AccountsFailed + AccountsSkipped: the function finished, but some
  #     account got no digest (SES rejected it, the account was unreadable,
  #     or the client has no contact). The handler catches those per account,
  #     so Errors stays at zero.
  #
  # urgency=low: a missed digest is a day late, not an outage. It runs at
  # 13:00 UTC, so this lands in the US morning anyway.
  DigestNotDeliveredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: platform-digest-not-delivered
      AlarmDescription: >-
        The instrumentation digest did not reach every account today. Either
        the function failed outright (see /aws/lambda/platform-digest) or it
        finished with accounts in its failed or skipped lists, which the
        run's final log line names with the reason.

        [platform-routing] routing=pagerduty layer=infrastructure urgency=low
      Metrics:
        - Id: undelivered
          Label: Errors plus accounts failed or skipped
          Expression: 'FILL(errors, 0) + FILL(failed, 0) + FILL(skipped, 0)'
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DigestFunction
            Period: 3600
            Stat: Sum
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AltDigital/Digest
              MetricName: AccountsFailed
            Period: 3600
            Stat: Sum
        - Id: skipped
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AltDigital/Digest
              MetricName: AccountsSkipped
            Period: 3600
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # notBreaching: the function runs once a day, so 23 of 24 hours have no
      # data and that is normal. A schedule that stops firing altogether is
      # not caught here; that would need a heartbeat, and is noted in B-155.
      TreatMissingData: notBreaching
      # D-028: no direct action. Delivered by the router (the marker above, and
      # alerting/60-alarm-forwarding.yaml in this account).

  # A digest that left SES and did not arrive. The function's view of this is
  # a successful send, so platform-digest-not-delivered cannot see it. That is
  # prompt 4.4's rotted contact: "a bounced digest is a finding".
  #
  # Kept separate from the not-delivered alarm because the fix is different:
  # that one means look at the function, this one means fix the contact on the
  # client's registry record (questionnaire 3.6 / 3.1).
  #
  # It stays live once the contact is wrong. The account suppression list
  # holds bounced and complaining addresses, and SES turns each later send to
  # one into another bounce event, so this fires every day until the contact
  # is fixed AND the address is removed from the list.
  DigestBouncedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasSender
    Properties:
      AlarmName: platform-digest-bounced
      AlarmDescription: >-
        A digest was accepted by SES but bounced, was rejected, or drew a spam
        complaint, so the client contact did not receive it and the evidence
        record overstates what was communicated. The address is on the SES
        account suppression list in Infra Tooling
        (aws sesv2 list-suppressed-destinations). Correct the contact on the
        client registry record, then remove the address from the list, or
        every later digest to it is suppressed too.

        [platform-routing] routing=pagerduty layer=infrastructure urgency=low
      Metrics:
        - Id: undelivered
          Label: Bounces, complaints and rejects
          Expression: 'FILL(bounce, 0) + FILL(complaint, 0) + FILL(reject, 0)'
          ReturnData: true
        - Id: bounce
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SES
              MetricName: Bounce
              Dimensions:
                - { Name: configuration-set, Value: platform-digest }
            Period: 3600
            Stat: Sum
        - Id: complaint
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SES
              MetricName: Complaint
              Dimensions:
                - { Name: configuration-set, Value: platform-digest }
            Period: 3600
            Stat: Sum
        - Id: reject
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/SES
              MetricName: Reject
              Dimensions:
                - { Name: configuration-set, Value: platform-digest }
            Period: 3600
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      # D-028: no direct action. Delivered by the router.

Outputs:

  FunctionName:
    Description: Digest sender
    Value: !Ref DigestFunction

  Mode:
    Description: Whether digests are actually sent
    Value: !If [HasSender, 'sending', 'report-only — no verified SES sender configured']

  BounceTopicArn:
    Condition: HasSender
    Description: Bounces, complaints, rejects and rendering failures
    Value: !Ref BounceTopic
