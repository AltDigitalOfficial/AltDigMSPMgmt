              - 'codestar:List*'
              - 'cognito-identity:Get*'
              - 'cognito-identity:List*'
              - 'cognito-idp:List*'
              - 'cognito-sync:List*'
              - 'comprehend:Describe*'
              - 'comprehend:List*'
              - 'config:Describe*'
              - 'config:Get*'
              - 'config:List*'
              - 'config:Select*'
              - 'connect:List*'
              - 'cost-optimization-hub:Get*'
              - 'cost-optimization-hub:List*'
              - 'databrew:List*'
              - 'datapipeline:Describe*'
              - 'datapipeline:Get*'
