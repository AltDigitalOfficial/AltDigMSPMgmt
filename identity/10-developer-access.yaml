              - 'sagemaker:Describe*'
              - 'sagemaker:List*'
              - 'sdb:List*'
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:ListSecrets'
              - 'securityhub:Describe*'
              - 'securityhub:Get*'
              - 'securityhub:List*'
              - 'servicecatalog:List*'
              - 'ses:Describe*'
              - 'ses:List*'
              - 'shield:List*'
              - 'sns:Get*'
              - 'sns:List*'
              - 'sqs:Get*'
              - 'sqs:List*'
              - 'ssm:List*'
              - 'states:List*'
              - 'storagegateway:Describe*'
              - 'storagegateway:List*'
              - 'sts:GetCallerIdentity'
              - 'swf:List*'
              - 'tag:Get*'
              - 'tiros:Get*'
              - 'trustedadvisor:Describe*'
              - 'uxc:Get*'
              - 'uxc:List*'
              - 'waf-regional:List*'
              - 'waf:List*'
              - 'wafv2:List*'
              - 'wisdom:List*'
              - 'workdocs:Describe*'
              - 'workmail:Describe*'
              - 'workspaces:Describe*'
              - 'xray:BatchGet*'
              - 'xray:Get*'
              - 'xray:List*'
            Resource: '*'

          # Reads by verb shape that return DATA rather than state. Most are
          # not granted by anything above; denied so that stays true if a
          # policy is attached later. The ECS and Lambda entries are D-017:
          # they return environment variable values, and ecs:Describe* in
          # ViewOnlyAccess would otherwise reach DescribeTaskDefinition.
          - Sid: NeverTheDataPlane
            Effect: Deny
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:BatchGetSecretValue'
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              - 'ssm:GetParametersByPath'
              - 'ssm:GetParameterHistory'
              - 'dynamodb:GetItem'
              - 'dynamodb:BatchGetItem'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
              - 'rds-data:*'
              - 'ecs:DescribeTaskDefinition'
              - 'lambda:GetFunction'
              - 'lambda:GetFunctionConfiguration'
              - 'ec2:GetPasswordData'
              - 'ec2:GetConsoleOutput'
              - 'ec2:GetConsoleScreenshot'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:ReEncryptFrom'
            Resource: '*'

  # Published so provisioning (phase 12) can assign these without being told
  # the ARNs. identity/00-commercial-readonly.yaml does the same.
  DevArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${SsmPrefix}/identity/permission-set/developer-dev'
      Type: String
      Value: !GetAtt DeveloperDevPermissionSet.PermissionSetArn

  TestArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${SsmPrefix}/identity/permission-set/developer-test'
      Type: String
      Value: !GetAtt DeveloperTestPermissionSet.PermissionSetArn

  ProdArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${SsmPrefix}/identity/permission-set/developer-prod'
      Type: String
      Value: !GetAtt DeveloperProdPermissionSet.PermissionSetArn

  ReadOnlyArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${SsmPrefix}/identity/permission-set/tenant-readonly'
      Type: String
      Value: !GetAtt TenantReadOnlyPermissionSet.PermissionSetArn

Outputs:

  DeveloperDevArn:
    Description: dev grant. Full within guardrails.
    Value: !GetAtt DeveloperDevPermissionSet.PermissionSetArn

  DeveloperTestArn:
    Description: test grant. Read-only plus restart.
    Value: !GetAtt DeveloperTestPermissionSet.PermissionSetArn

  DeveloperProdArn:
    Description: prod and uat grant. Read and observe.
    Value: !GetAtt DeveloperProdPermissionSet.PermissionSetArn

  TenantReadOnlyArn:
    Description: oversight grant, every environment. Read and observe.
    Value: !GetAtt TenantReadOnlyPermissionSet.PermissionSetArn
