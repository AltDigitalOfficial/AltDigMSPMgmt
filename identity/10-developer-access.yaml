              - 'redshift:View*'
              - 'resource-explorer-2:Get*'
              - 'resource-explorer-2:List*'
              - 'rolesanywhere:List*'
              - 'route53:Get*'
              - 'route53:List*'
              - 'route53domains:List*'
              - 'route53profiles:Get*'
              - 'route53profiles:List*'
