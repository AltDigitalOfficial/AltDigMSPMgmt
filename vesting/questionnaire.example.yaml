# Example completed questionnaire. Placeholder contacts only.
#
# A REAL completed questionnaire must never be committed: it carries named
# contacts with direct email addresses, which the repository rules treat as
# personal data the same way as config/contacts.env. Enforced in .gitignore
# and the pre-commit hook. Name real ones *.questionnaire.yaml.
#
# Shaped on the OEight / Arc8 relationship for realism. The values here are
# illustrative and are NOT Arc8's actual contract terms.

schema_version: 1

identity:
  partner: oeight
  client_name: "OEight"
  client_slug: oeight
  application_name: "Arc8"
  application_code: arc8
  service_model: B
  partner_is_application_owner: true    # OEight owns the Arc8 IP
  technical_contact:  { name: "Placeholder Tech",   email: "tech@example.com" }
  escalation_contact: { name: "Placeholder Esc",    email: "esc@example.com" }
  change_approver:    { name: "Placeholder Appr",   email: "appr@example.com" }
  billing_contact:    { name: "Placeholder Bill",   email: "bill@example.com" }
  # Who AltDigital notifies of a breach: a person who can act for the
  # organisation legally. The partner's, unless the client is direct or the
  # partner owns the application (as here).
  breach_notification_contact: { name: "Placeholder Owner", email: "owner@example.com" }
  # Day-to-day security operations; may be a delegate.
  security_contact:   { name: "Placeholder Sec",    email: "sec@example.com" }

compliance:
  frameworks: [hipaa, soc2]
  non_us_data_subjects: false
  data_classification: regulated
  cardholder_data: false
  phi: true
  baa_window_partner_to_client_hours: 48

network:
  egress_profile: isolated
  internet_exposure: outbound
  inbound_cross_tenant_api: false
  outbound_allowlist: []

environments:
  uat_required: false
  timezone: America/Chicago
  hoop:
    dev:  { always_on: false, days: [mon, tue, wed, thu, fri], start: "07:00", end: "19:00" }
    test: { always_on: false, days: [mon, tue, wed, thu, fri], start: "07:00", end: "19:00" }
  manual_turnup_authorised: ["OEight engineering leads"]

resilience:
  rto_hours: 4
  rpo_hours: 2
  sla_tier: standard
  # null takes the platform default of 35 days. A client wanting longer says so
  # here; 35 is a floor rather than a starting point, because the copy vault's
  # Vault Lock rejects anything shorter.
  backup_retention_days: null
  # Two windows (form 5.6 / 5.7). prod is always on, so its window can sit
  # outside the users' day, and may cross midnight: days are the days it
  # starts. Each window may name its own timezone; absent, environments.timezone.
  #
  # nonprod is the form's recommended answer, a choice rather than a time.
  # derive-vesting.py computes the window from each environment's HOOP using
  # vesting/derivation-rules.yaml. `outside-developer-hours` needs the
  # environment woken for it (B-141, not built), which derivation warns about.
  maintenance_windows:
    prod:    { days: [sat], start: "23:00", end: "01:00", timezone: America/Chicago }
    nonprod: outside-developer-hours

security:
  dedicated_kms_key: false
  fips_or_cloudhsm: false
  external_key_material: false
  migrating_secrets: false
  customer_staff_need_access: true
  no_regulated_data_in_lower_envs_ack: true
  developer_manager: { name: "Placeholder Mgr", email: "mgr@example.com" }
  dedicated_infrastructure_required: false
  dedicated_infrastructure_driver: null
  dedicated_infrastructure_control_ref: null

licensing:
  customer_owned_licences: [none]
  entitlement_evidence_provided: false
  microsoft_licensing_via: not-applicable

monitoring:
  working_definition: "A clinician can sign in and retrieve a patient record within a few seconds. If sign-in fails or the record list is empty, users notice immediately."
  endpoints: ["https://arc8.example.com/health"]
  success_condition: "HTTP 200 and body contains \"ok\""
  acceptable_response_ms: 2000
  existing_test_suite: none
  journey_requires_auth: true

change:
  cicd_tooling: "GitHub Actions"
  deployment_frequency: weekly
  customer_escalation_contacts: []
  # Form 12.4. Where the application's change records live. client-jira is the
  # client's own Atlassian site, read with a read-only service account they
  # create there (scripts/set-jira-token.sh --tenant <partner>-<client>).
  ticketing:
    system: client-jira
    product: jira-service-management
    site: "https://example.atlassian.net"
    project_key: ARC8

exit:
  ip_boundary_ack: true
  post_exit_governance_loss_ack: true
  truveon_retention_desired: false

# Section 16. One Truveon tenant per client (B-023). OEight already has one --
# it was provisioned 2026-09-08, before the platform existed -- so creation is
# skipped and the tenant is configured and linked only. People are NOT here;
# they are in the Truveon roster sidecar (vesting/truveon.roster.example.yaml).
truveon:
  existing_tenant: true
  tenant_slug: oeight
  tenant_name: "OEight"
  legal_entities:
    - { ref: OE, legal_name: "OEight Placeholder LLC", entity_kind: parent, jurisdiction: "US-TX" }
  send_invites: false
