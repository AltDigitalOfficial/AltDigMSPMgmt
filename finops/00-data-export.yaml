AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform - the organization's CUR 2.0 export, defined in
  the management account and delivered to the FinOps account. Phase 15.9
  step 2. Deploy in us-east-1, the only region Data Exports runs in.

# ---------------------------------------------------------------------------
# Deployed in the management account, by Jamie
# ---------------------------------------------------------------------------
# A billing export can only be defined by the payer. This is the one piece of
# 15.9 that lives in the management account, and it holds nothing: the data
# is written straight to altdig-cost-exports-<finops> (finops/10-cost-exports.
# yaml), which must exist, with its bucket and key policies, first.
#
#   aws cloudformation deploy --region us-east-1 --profile msp-mgmt \
#     --stack-name platform-cost-export \
#     --template-file finops/00-data-export.yaml \
#     --parameter-overrides DestinationAccountId=<finops> \
#       DestinationBucket=altdig-cost-exports-<finops> \
#     --tags platform-layer=infrastructure platform-managed=true
#
# ---------------------------------------------------------------------------
# What the export holds
# ---------------------------------------------------------------------------
# Every column of the CUR 2.0 table, 116, listed from `aws bcm-data-exports
# get-table` on 2026-11-01 with the table properties below. All of them,
# because report.py's basis check compares list against net, and the tags and
# cost_category maps carry the allocation dimensions. A column AWS adds later
# is not picked up until this list is regenerated.
#
#   INCLUDE_RESOURCES      TRUE   resource ids, for per-resource questions
#   TIME_GRANULARITY       DAILY  enough for billing; hourly is 24 times the rows
#   split cost allocation  FALSE  no ECS or EKS shared clusters to split
#
# Parquet, overwritten daily per billing period: the current month's files
# are replaced as the month's charges settle, so a query always reads one
# version of each period.

# The repository lints in us-east-2 (.cfnlintrc.yaml). This template is
# us-east-1 only, where the resource type exists.
Metadata:
  cfn-lint:
    config:
      regions: [us-east-1]

Parameters:

  DestinationAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: The FinOps account, from /platform/org/account/altdig-infra-finops.

  DestinationBucket:
    Type: String
    AllowedPattern: '^altdig-cost-exports-[0-9]{12}$'
    Description: The ExportBucketName output of finops/10-cost-exports.yaml.

  DestinationRegion:
    Type: String
    Default: us-east-2
    AllowedValues: [us-east-1, us-east-2, us-west-2]

  ExportName:
    Type: String
    Default: platform-cur2
    Description: The export, under prefix cur2/ in the destination bucket.

Resources:

  CostExport:
    Type: AWS::BCMDataExports::Export
    Properties:
      Export:
        Name: !Ref ExportName
        Description: CUR 2.0 for the organization, delivered to the FinOps account.
        DataQuery:
          QueryStatement: >-
            SELECT identity_line_item_id, identity_time_interval,
            bill_invoice_id, bill_invoicing_entity, bill_billing_entity,
            bill_bill_type, bill_payer_account_id, bill_payer_account_name,
            bill_billing_period_start_date, bill_billing_period_end_date,
            line_item_usage_account_id, line_item_usage_account_name,
            line_item_line_item_type, line_item_usage_start_date,
            line_item_usage_end_date, line_item_product_code,
            line_item_usage_type, line_item_operation,
            line_item_availability_zone, line_item_resource_id,
            line_item_usage_amount, line_item_normalization_factor,
            line_item_normalized_usage_amount, line_item_currency_code,
            line_item_unblended_rate, line_item_unblended_cost,
            line_item_user_identifier, line_item_blended_rate,
            line_item_blended_cost, line_item_line_item_description,
            line_item_tax_type, line_item_net_unblended_rate,
            line_item_net_unblended_cost, line_item_legal_entity,
            product_servicecode, product_operation, product_usagetype,
            product_sku, product_product_family, product_comment,
            product_fee_code, product_fee_description, product_location,
            product_location_type, product_region_code, product_from_location,
            product_from_location_type, product_from_region_code,
            product_to_location, product_to_location_type,
            product_to_region_code, product_instance_family,
            product_instance_type, product_instancesku, product_pricing_unit,
            product, pricing_lease_contract_length, pricing_offering_class,
            pricing_purchase_option, pricing_rate_code, pricing_rate_id,
            pricing_currency, pricing_public_on_demand_rate,
            pricing_public_on_demand_cost, pricing_term, pricing_unit,
            reservation_availability_zone, reservation_start_time,
            reservation_end_time, reservation_modification_status,
            reservation_amortized_upfront_cost_for_usage,
            reservation_amortized_upfront_fee_for_billing_period,
            reservation_unused_amortized_upfront_fee_for_billing_period,
            reservation_recurring_fee_for_usage,
            reservation_unused_recurring_fee, reservation_effective_cost,
            reservation_upfront_value,
            reservation_net_amortized_upfront_cost_for_usage,
            reservation_net_amortized_upfront_fee_for_billing_period,
            reservation_net_unused_amortized_upfront_fee_for_billing_period,
            reservation_net_recurring_fee_for_usage,
            reservation_net_unused_recurring_fee,
            reservation_net_effective_cost, reservation_net_upfront_value,
            reservation_normalized_units_per_reservation,
            reservation_number_of_reservations, reservation_reservation_a_r_n,
            reservation_subscription_id,
            reservation_total_reserved_normalized_units,
            reservation_total_reserved_units,
            reservation_units_per_reservation,
            reservation_unused_normalized_unit_quantity,
            reservation_unused_quantity,
            savings_plan_total_commitment_to_date,
            savings_plan_savings_plan_a_r_n, savings_plan_savings_plan_rate,
            savings_plan_used_commitment,
            savings_plan_savings_plan_effective_cost,
            savings_plan_amortized_upfront_commitment_for_billing_period,
            savings_plan_recurring_commitment_for_billing_period,
            savings_plan_net_savings_plan_effective_cost,
            savings_plan_net_amortized_upfront_commitment_for_billing_period,
            savings_plan_net_recurring_commitment_for_billing_period,
            savings_plan_start_time, savings_plan_end_time,
            savings_plan_instance_type_family, savings_plan_offering_type,
            savings_plan_payment_option, savings_plan_purchase_term,
            savings_plan_region, discount_bundled_discount,
            discount_total_discount, discount, resource_tags, tags,
            cost_category FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              INCLUDE_RESOURCES: 'TRUE'
              TIME_GRANULARITY: DAILY
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: 'FALSE'
              INCLUDE_MANUAL_DISCOUNT_COMPATIBILITY: 'FALSE'
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref DestinationBucket
            S3BucketOwner: !Ref DestinationAccountId
            S3Prefix: cur2
            S3Region: !Ref DestinationRegion
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: PARQUET
              Compression: PARQUET
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

Outputs:

  ExportArn:
    Value: !Ref CostExport
