AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  AltDigital Managed Platform - where the organization's billing data lands,
  in the FinOps account. The CUR 2.0 export defined in the management account
  (finops/00-data-export.yaml) delivers here directly. Phase 15.9 step 2.

# ---------------------------------------------------------------------------
# Why a separate account
# ---------------------------------------------------------------------------
# Design 12:30-32: CUR to S3 in a dedicated reporting account. Until now the
# only place billing data could be read was the management account, which is
# why CommercialReadOnly is assigned there (D-009). The management account
# holds the Organization and nothing else, so reading cost there means
# giving commercial staff a session in the most powerful account we have.
#
# Data Exports has delivered across accounts since April 2026, so the export
# writes straight into this bucket. No copy sits in the management account
# and nothing replicates.
#
# ---------------------------------------------------------------------------
# Encryption
# ---------------------------------------------------------------------------
# The platform rule is SSE-KMS with a platform key (policies/guard), and the
# bucket defaults to it. The export does not use it: Data Exports writes every
# object with SSE-S3 explicitly, which overrides a bucket default, and the
# first delivery (2026-11-06) arrived AES256. AWS documents KMS as applicable
# only after delivery. Accepted as D-035, which says why re-encrypting was not
# built. The key still encrypts Athena results and anything else written here,
# and its grant to the export service is kept for the day the service honours
# it.
#
# ---------------------------------------------------------------------------
# Retention
# ---------------------------------------------------------------------------
# Jamie, 2026-11-01: seven years. 2557 days. No Object Lock: this is an
# operational copy of billing data that AWS also holds, not evidence. The
# export overwrites each billing period's files daily (OVERWRITE_REPORT), so
# the overwritten versions are noncurrent and go after 30 days.
#
# ---------------------------------------------------------------------------
# The table
# ---------------------------------------------------------------------------
# platform_cost.cur2 is defined from the first delivery's manifest (116
# columns, 2026-11-06), not guessed and not inferred daily by a crawler. The
# column list is the export's query (finops/00-data-export.yaml) in the same
# order. Add a column to both, or neither.

Parameters:

  ManagementAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: >-
      The payer, which owns the export. From config/platform.env
      (PLATFORM_MGMT_ACCOUNT_ID); never typed into the template.

  RetentionDays:
    Type: Number
    Default: 2557
    MinValue: 2557
    Description: Seven years (Jamie, 2026-11-01). The floor, so it can only grow.

  QuorumExecutionRoleName:
    Type: String
    Default: PlatformQuorumExecutor
    Description: The only role permitted to disable or delete the key.

Resources:

  CostKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Billing data in the FinOps account (Data Exports, Athena results)
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Readers are granted through their own IAM policies.
          - Sid: EnableIAMPolicyDelegation
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: DenyDestructiveActionsOutsideQuorum
            Effect: Deny
            Principal: '*'
            Action:
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey'
              - 'kms:DisableKeyRotation'
              - 'kms:DeleteImportedKeyMaterial'
            Resource: '*'
            Condition:
              ArnNotLike:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:sts::*:assumed-role/${QuorumExecutionRoleName}/*'
          # What an SSE-KMS PutObject needs from the writer. Same conditions as
          # the bucket policy: only exports the management account owns.
          - Sid: DataExportsDelivery
            Effect: Allow
            Principal: { Service: bcm-data-exports.amazonaws.com }
            Action:
              - 'kms:GenerateDataKey'
              - 'kms:Decrypt'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref ManagementAccountId
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bcm-data-exports:us-east-1:${ManagementAccountId}:export/*'
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }
        - { Key: KeyPurpose,       Value: cost }

  CostKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/platform-cost
      TargetKeyId: !Ref CostKey

  ExportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'altdig-cost-exports-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CostKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # ACLs off, so the bucket owns every delivered object outright.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBillingData
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

  ExportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # The policy Data Exports requires, verbatim in shape. Changing it
          # after the export exists can stop delivery (AWS's own warning).
          - Sid: EnableAWSDataExportsToWriteToS3
            Effect: Allow
            Principal: { Service: bcm-data-exports.amazonaws.com }
            Action: 's3:PutObject'
            Resource: !Sub '${ExportBucket.Arn}/*'
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bcm-data-exports:us-east-1:${ManagementAccountId}:export/*'
              StringEquals:
                'aws:SourceAccount': !Ref ManagementAccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub '${ExportBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'altdig-cost-athena-results-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CostKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Query results are scratch. Anything worth keeping is a view or a report.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub '${AthenaResultsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  CostDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: platform_cost
        Description: CUR 2.0 billing data.

  # One partition per billing period, as the export writes them
  # (data/BILLING_PERIOD=yyyy-MM/). Projected, so a new month needs nothing.
  # Each period's files are rewritten daily until the month closes, and a
  # query reads whatever the last rewrite left: the current month is
  # provisional until AWS finalises the bill.
  CurTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref CostDatabase
      TableInput:
        Name: cur2
        Description: CUR 2.0 export platform-cur2, one partition per billing period.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.billing_period.type: date
          projection.billing_period.format: yyyy-MM
          projection.billing_period.range: '2026-11,NOW'
          projection.billing_period.interval: '1'
          projection.billing_period.interval.unit: MONTHS
          storage.location.template: !Sub 's3://${ExportBucket}/cur2/platform-cur2/data/BILLING_PERIOD=${!billing_period}'
        PartitionKeys:
          - { Name: billing_period, Type: string }
        StorageDescriptor:
          Location: !Sub 's3://${ExportBucket}/cur2/platform-cur2/data/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - { Name: identity_line_item_id, Type: string }
            - { Name: identity_time_interval, Type: string }
            - { Name: bill_invoice_id, Type: string }
            - { Name: bill_invoicing_entity, Type: string }
            - { Name: bill_billing_entity, Type: string }
            - { Name: bill_bill_type, Type: string }
            - { Name: bill_payer_account_id, Type: string }
            - { Name: bill_payer_account_name, Type: string }
            - { Name: bill_billing_period_start_date, Type: timestamp }
            - { Name: bill_billing_period_end_date, Type: timestamp }
            - { Name: line_item_usage_account_id, Type: string }
            - { Name: line_item_usage_account_name, Type: string }
            - { Name: line_item_line_item_type, Type: string }
            - { Name: line_item_usage_start_date, Type: timestamp }
            - { Name: line_item_usage_end_date, Type: timestamp }
            - { Name: line_item_product_code, Type: string }
            - { Name: line_item_usage_type, Type: string }
            - { Name: line_item_operation, Type: string }
            - { Name: line_item_availability_zone, Type: string }
            - { Name: line_item_resource_id, Type: string }
            - { Name: line_item_usage_amount, Type: double }
            - { Name: line_item_normalization_factor, Type: double }
            - { Name: line_item_normalized_usage_amount, Type: double }
            - { Name: line_item_currency_code, Type: string }
            - { Name: line_item_unblended_rate, Type: string }
            - { Name: line_item_unblended_cost, Type: double }
            - { Name: line_item_user_identifier, Type: string }
            - { Name: line_item_blended_rate, Type: string }
            - { Name: line_item_blended_cost, Type: double }
            - { Name: line_item_line_item_description, Type: string }
            - { Name: line_item_tax_type, Type: string }
            - { Name: line_item_net_unblended_rate, Type: string }
            - { Name: line_item_net_unblended_cost, Type: double }
            - { Name: line_item_legal_entity, Type: string }
            - { Name: product_servicecode, Type: string }
            - { Name: product_operation, Type: string }
            - { Name: product_usagetype, Type: string }
            - { Name: product_sku, Type: string }
            - { Name: product_product_family, Type: string }
            - { Name: product_comment, Type: string }
            - { Name: product_fee_code, Type: string }
            - { Name: product_fee_description, Type: string }
            - { Name: product_location, Type: string }
            - { Name: product_location_type, Type: string }
            - { Name: product_region_code, Type: string }
            - { Name: product_from_location, Type: string }
            - { Name: product_from_location_type, Type: string }
            - { Name: product_from_region_code, Type: string }
            - { Name: product_to_location, Type: string }
            - { Name: product_to_location_type, Type: string }
            - { Name: product_to_region_code, Type: string }
            - { Name: product_instance_family, Type: string }
            - { Name: product_instance_type, Type: string }
            - { Name: product_instancesku, Type: string }
            - { Name: product_pricing_unit, Type: string }
            - { Name: product, Type: 'map<string,string>' }
            - { Name: pricing_lease_contract_length, Type: string }
            - { Name: pricing_offering_class, Type: string }
            - { Name: pricing_purchase_option, Type: string }
            - { Name: pricing_rate_code, Type: string }
            - { Name: pricing_rate_id, Type: string }
            - { Name: pricing_currency, Type: string }
            - { Name: pricing_public_on_demand_rate, Type: string }
            - { Name: pricing_public_on_demand_cost, Type: double }
            - { Name: pricing_term, Type: string }
            - { Name: pricing_unit, Type: string }
            - { Name: reservation_availability_zone, Type: string }
            - { Name: reservation_start_time, Type: string }
            - { Name: reservation_end_time, Type: string }
            - { Name: reservation_modification_status, Type: string }
            - { Name: reservation_amortized_upfront_cost_for_usage, Type: double }
            - { Name: reservation_amortized_upfront_fee_for_billing_period, Type: double }
            - { Name: reservation_unused_amortized_upfront_fee_for_billing_period, Type: double }
            - { Name: reservation_recurring_fee_for_usage, Type: double }
            - { Name: reservation_unused_recurring_fee, Type: double }
            - { Name: reservation_effective_cost, Type: double }
            - { Name: reservation_upfront_value, Type: double }
            - { Name: reservation_net_amortized_upfront_cost_for_usage, Type: double }
            - { Name: reservation_net_amortized_upfront_fee_for_billing_period, Type: double }
            - { Name: reservation_net_unused_amortized_upfront_fee_for_billing_period, Type: double }
            - { Name: reservation_net_recurring_fee_for_usage, Type: double }
            - { Name: reservation_net_unused_recurring_fee, Type: double }
            - { Name: reservation_net_effective_cost, Type: double }
            - { Name: reservation_net_upfront_value, Type: double }
            - { Name: reservation_normalized_units_per_reservation, Type: string }
