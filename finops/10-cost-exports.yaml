            - { Name: reservation_total_reserved_units, Type: string }
            - { Name: reservation_units_per_reservation, Type: string }
            - { Name: reservation_unused_normalized_unit_quantity, Type: double }
            - { Name: reservation_unused_quantity, Type: double }
            - { Name: savings_plan_total_commitment_to_date, Type: double }
            - { Name: savings_plan_savings_plan_a_r_n, Type: string }
            - { Name: savings_plan_savings_plan_rate, Type: double }
            - { Name: savings_plan_used_commitment, Type: double }
            - { Name: savings_plan_savings_plan_effective_cost, Type: double }
            - { Name: savings_plan_amortized_upfront_commitment_for_billing_period, Type: double }
            - { Name: savings_plan_recurring_commitment_for_billing_period, Type: double }
            - { Name: savings_plan_net_savings_plan_effective_cost, Type: double }
            - { Name: savings_plan_net_amortized_upfront_commitment_for_billing_period, Type: double }
            - { Name: savings_plan_net_recurring_commitment_for_billing_period, Type: double }
            - { Name: savings_plan_start_time, Type: string }
            - { Name: savings_plan_end_time, Type: string }
            - { Name: savings_plan_instance_type_family, Type: string }
            - { Name: savings_plan_offering_type, Type: string }
            - { Name: savings_plan_payment_option, Type: string }
            - { Name: savings_plan_purchase_term, Type: string }
            - { Name: savings_plan_region, Type: string }
            - { Name: discount_bundled_discount, Type: double }
            - { Name: discount_total_discount, Type: double }
            - { Name: discount, Type: 'map<string,string>' }
            - { Name: resource_tags, Type: 'map<string,string>' }
            - { Name: tags, Type: 'map<string,string>' }
            - { Name: cost_category, Type: 'map<string,string>' }

  # Enforced, so a query cannot choose an unencrypted result location. The
  # per-query scan cap stops a mistaken SELECT * over seven years from being
  # an expensive surprise; CUR 2.0 Parquet for this organization is small.
  CostWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: platform-finops
      Description: FinOps queries over the CUR 2.0 export.
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10737418240
        ResultConfiguration:
          OutputLocation: !Sub 's3://${AthenaResultsBucket}/'
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey: !GetAtt CostKey.Arn
      Tags:
        - { Key: platform-managed, Value: 'true' }
        - { Key: platform-layer,   Value: infrastructure }

  # -------------------------------------------------------------------------
  # Internal margin report: shared cost allocated to tenants (F-8, D-036)
  # -------------------------------------------------------------------------
  # INTERNAL ONLY. Never an input to an invoice.
  #
  # 15.9 step 5 asked for split-charge rules spreading the management,
  # Security and Infrastructure accounts' cost across tenants by spend. Design
  # 10 says shared platform cost is absorbed into the percentage uplift, never
  # allocated, and allocated cost inside a tenant's raw AWS figure would carry
  # the uplift too: cost-plus on cost-plus. F-8 (docs/phase-15-plan.md §6.8)
  # resolved it: no split-charge rules; the allocation exists only here, so
  # AltDigital can see what each tenant really costs to run.
  #
  # A saved query rather than an Athena view: a view managed by CloudFormation
  # is a Glue table carrying base64-encoded Presto text, which is fragile to
  # maintain and gains nothing for a report a person runs. D-036.
  #
  # scripts/test-cost-report.py fails if anything outside this template and
  # the documentation names it. cost/src/report.py, the invoice path, must
  # never read it.
  QueryInternalSharedCostAllocation:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: internal-shared-cost-allocation
      Description: INTERNAL ONLY, never invoiced (F-8, D-036). Shared platform cost allocated to tenants in proportion to their own AWS spend, per billing period.
      WorkGroup: !Ref CostWorkGroup
      Database: !Ref CostDatabase
      QueryString: |
        WITH by_kind AS (
          SELECT billing_period,
                 element_at(cost_category, 'tenant') AS tenant,
                 element_at(cost_category, 'account_kind') AS kind,
                 sum(line_item_unblended_cost) AS cost
          FROM cur2
          GROUP BY 1, 2, 3
        ),
        shared AS (
          SELECT billing_period, sum(cost) AS shared_cost
          FROM by_kind WHERE kind = 'shared' GROUP BY 1
        ),
        tenants AS (
          SELECT billing_period, tenant, sum(cost) AS tenant_aws_cost
          FROM by_kind WHERE kind = 'tenant' GROUP BY 1, 2
        )
        SELECT t.billing_period,
               t.tenant,
               t.tenant_aws_cost,
               t.tenant_aws_cost / sum(t.tenant_aws_cost) OVER (PARTITION BY t.billing_period) AS share_of_tenant_spend,
               s.shared_cost * t.tenant_aws_cost / sum(t.tenant_aws_cost) OVER (PARTITION BY t.billing_period) AS allocated_shared_cost,
               (t.tenant_aws_cost + s.shared_cost * t.tenant_aws_cost / sum(t.tenant_aws_cost) OVER (PARTITION BY t.billing_period)) / t.tenant_aws_cost AS fully_loaded_multiple
        FROM tenants t
        JOIN shared s ON s.billing_period = t.billing_period
        ORDER BY 1, 2

Outputs:

  ExportBucketName:
    Description: Pass to finops/00-data-export.yaml as DestinationBucket.
    Value: !Ref ExportBucket

  CostKeyArn:
    Value: !GetAtt CostKey.Arn

  WorkGroupName:
    Value: !Ref CostWorkGroup
