# AltDigital Managed Platform — standard alarm sets
#
# ===========================================================================
# PROVISIONAL. THIS IS NOT THE AUTHORITATIVE TABLE.
# ===========================================================================
#
# Prompt 4.1 says: "Implement the standard alarm sets in the table in design
# 06." Design doc 06 (Observability) is NOT present in starter_docs/. There is
# no table to implement.
#
# Rather than block the whole of phase 4 on a missing document, the MECHANISM
# is built and this file carries a defensible starting set. That is the point
# of the prompt's own instruction to make it "a configuration document, not a
# switch statement": when doc 06 arrives, replacing these values is a data edit
# that needs no code change and no redeploy of the Lambda.
#
# Every threshold below is a judgement, not a citation. Treat them as a
# proposal to be overwritten, and do not quote them to a client as the
# platform's monitoring standard until doc 06 has been reconciled against them.
#
# Tracked as B-024.
#
# ---------------------------------------------------------------------------
# Structure
# ---------------------------------------------------------------------------
#   resource_types:
#     <EventBridge resource discriminator>:
#       namespace:      CloudWatch namespace
#       dimension:      dimension name carrying the resource id
#       alarms:
#         - name_suffix, metric, statistic, period, evaluation_periods,
#           threshold, comparison, treat_missing_data, tiers
#
# `tiers` lists the monitoring tiers an alarm applies to. Tiers come from
# vesting/derivation-rules.yaml (full / production-equivalent / reduced), which
# is itself derived from the questionnaire rather than from design doc 14 —
# also absent. Two derived-from-absent-documents in one path is worth knowing
# about.

schema_version: 1

# Alarms that need the CloudWatch agent installed to report at all. Memory and
# disk are NOT emitted by EC2 by default — the hypervisor cannot see inside the
# instance. An alarm on a metric nobody publishes sits in INSUFFICIENT_DATA
# forever, which is indistinguishable from healthy at a glance and is why
# prompt 4.1 calls out the SSM association specifically.
agent_required_metrics:
  - mem_used_percent
  - disk_used_percent

resource_types:

  "AWS::EC2::Instance":
    namespace: AWS/EC2
    dimension: InstanceId
    alarms:
      - name_suffix: cpu-high
        metric: CPUUtilization
        statistic: Average
        period: 300
        evaluation_periods: 3
        threshold: 90
        comparison: GreaterThanThreshold
        treat_missing_data: missing
        tiers: [full, production-equivalent, reduced]

      - name_suffix: status-check-failed
        metric: StatusCheckFailed
        statistic: Maximum
        period: 60
        evaluation_periods: 2
        threshold: 1
        comparison: GreaterThanOrEqualToThreshold
        # breaching, not missing. An instance that has stopped reporting its
        # status check is not "fine, no data" — it is the exact condition this
        # alarm exists to catch.
        treat_missing_data: breaching
        tiers: [full, production-equivalent, reduced]

      - name_suffix: memory-high
        metric: mem_used_percent
        namespace: CWAgent
        statistic: Average
        period: 300
        evaluation_periods: 3
        threshold: 90
        comparison: GreaterThanThreshold
        treat_missing_data: missing
        tiers: [full, production-equivalent]

      - name_suffix: disk-high
        metric: disk_used_percent
        namespace: CWAgent
        statistic: Average
        period: 300
        evaluation_periods: 2
        threshold: 85
        comparison: GreaterThanThreshold
        treat_missing_data: missing
        tiers: [full, production-equivalent]

  "AWS::RDS::DBInstance":
    namespace: AWS/RDS
    dimension: DBInstanceIdentifier
    alarms:
      - name_suffix: cpu-high
        metric: CPUUtilization
        statistic: Average
        period: 300
        evaluation_periods: 3
        threshold: 90
        comparison: GreaterThanThreshold
        treat_missing_data: missing
        tiers: [full, production-equivalent, reduced]

      - name_suffix: storage-low
        metric: FreeStorageSpace
        statistic: Average
        period: 300
        evaluation_periods: 1
        # Bytes. 10 GiB. An absolute floor is wrong for a 16 TiB volume and
        # right for a 100 GiB one; CloudWatch cannot express "percent of
        # allocated storage" without a metric math alarm, which this
        # configuration format does not yet support. Recorded rather than
        # papered over — see B-024.
        threshold: 10737418240
        comparison: LessThanThreshold
        treat_missing_data: breaching
        tiers: [full, production-equivalent, reduced]

      - name_suffix: connections-high
        metric: DatabaseConnections
        statistic: Average
        period: 300
        evaluation_periods: 3
        threshold: 100
        comparison: GreaterThanThreshold
        treat_missing_data: missing
        tiers: [full, production-equivalent]

  "AWS::Lambda::Function":
    namespace: AWS/Lambda
    dimension: FunctionName
    alarms:
      - name_suffix: errors
        metric: Errors
        statistic: Sum
        period: 300
        evaluation_periods: 1
        threshold: 1
        comparison: GreaterThanOrEqualToThreshold
        treat_missing_data: notBreaching
        tiers: [full, production-equivalent, reduced]

      - name_suffix: throttles
        metric: Throttles
        statistic: Sum
        period: 300
        evaluation_periods: 1
        threshold: 1
        comparison: GreaterThanOrEqualToThreshold
        treat_missing_data: notBreaching
        tiers: [full, production-equivalent]

  "AWS::ElasticLoadBalancingV2::LoadBalancer":
    namespace: AWS/ApplicationELB
    dimension: LoadBalancer
    alarms:
      - name_suffix: 5xx
        metric: HTTPCode_ELB_5XX_Count
        statistic: Sum
        period: 300
        evaluation_periods: 2
        threshold: 10
        comparison: GreaterThanThreshold
        treat_missing_data: notBreaching
        tiers: [full, production-equivalent, reduced]

      - name_suffix: unhealthy-hosts
        metric: UnHealthyHostCount
        statistic: Maximum
        period: 60
        evaluation_periods: 3
        threshold: 1
        comparison: GreaterThanOrEqualToThreshold
        treat_missing_data: notBreaching
        tiers: [full, production-equivalent, reduced]

# ---------------------------------------------------------------------------
# Resource types deliberately NOT instrumented
# ---------------------------------------------------------------------------
# Listed explicitly so the Lambda can tell "we decided not to" apart from "we
# have never heard of this". Prompt 4.1 is emphatic that an unrecognised type
# is an exception rather than a no-op, and without this list every S3 bucket
# creation would raise one — which would bury the exceptions that matter.
ignored_resource_types:
  # Config's own pseudo-resources. These are not things that run; they are
  # Config's records OF things. Every rule evaluation emits a
  # ResourceCompliance item, so without these three the exception log fills at
  # the rate Config evaluates and the exception alarm sits permanently in
  # ALARM — which destroys the one signal that says a real resource came up
  # unmonitored.
  #
  # Found by testing, not by reading. The first canary deployment produced
  # exceptions for AWS::Config::ResourceCompliance within a minute, including
  # one for the instrumentation Lambda's own StackSet stack.
  - "AWS::Config::ResourceCompliance"
  - "AWS::Config::ConformancePackCompliance"
  - "AWS::SSM::ManagedInstanceInventory"

  - "AWS::S3::Bucket"                 # no per-bucket alarm is useful by default
  - "AWS::IAM::Role"                  # not a runtime resource
  - "AWS::IAM::Policy"
  - "AWS::Logs::LogGroup"             # covered by the data protection policy
  - "AWS::CloudFormation::Stack"      # a container, not a thing that runs
  - "AWS::EC2::NetworkInterface"      # created as a side effect of other types
  - "AWS::EC2::Volume"                # alarmed via the instance, not directly
